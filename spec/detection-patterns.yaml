    regex: '(?i)(?:\b(?:password|passwd|pwd|secret|keystorePass|truststorePass|keyPass|connectionPassword|ClearTextPassword|apiKey)\s*=\s*"(?P<secret>[^"$]{4,})"|key\s*=\s*"(?:[^"]*(?:password|secret|token|apikey))"\s+value\s*=\s*"(?P<secret2>[^"$]{4,})")'
    note: 'Tomcat server.xml, context.xml, web.config <add key=".. Password" value="..">, NuGet.Config ClearTextPassword'
    pos: ['<Connector port="8443" keystorePass="T0mcatKs" />', '<add key="ClearTextPassword" value="NuGetPw9" />', '<Resource name="jdbc/x" username="app" password="CtxPw2026"/>']
    neg: ['<Connector keystorePass="${ks.pass}"/>']

  - id: config.php-define-or-array
    category: config_key
    overlap: none
    confidence: high
    severity: high
    keywords: [define(, db_password, '=>']
    regex: '(?i)(?:define\(\s*["''](?P<name>[A-Z0-9_]*(?:PASSWORD|PASS|SECRET|KEY|SALT|TOKEN))["'']\s*,\s*["''](?P<secret>[^"''$]{4,})["'']|["''](?P<name2>[a-z0-9_]*(?:password|passwd|pass|secret|token|api_?key))["'']\s*=>\s*["''](?P<secret2>[^"''$]{4,})["''])'
    pos: ["define( 'DB_PASSWORD', 'WpDbPw2026' );", "'password' => 'LaravelPw9',"]
    neg: ["define('DB_PASSWORD', getenv('DB_PASSWORD'));", "'password' => env('DB_PASSWORD'),"]

  - id: config.code-assignment
    category: config_key
    overlap: partial
    confidence: low
    severity: medium
    keywords: [password, passwd, secret, token, api_key, apikey]
    regex: '(?i)\b(?P<name>[a-z0-9_]*(?:password|passwd|pwd|secret|token|api_?key|apikey|access_?key|private_?key))\s*(?::\s*\w+\s*)?(?:=|:=|<-)\s*["''`](?P<secret>[^"''`$\\{\s][^"''`\\\s]{3,})["''`]'
    note: lowest tier; Betterleaks/TruffleHog generic rules overlap for high-entropy values; keep for low-entropy human passwords
    pos: ['db_password = "Py!Pw2026"', 'const apiKey = `opaque-123-key`', 'smtpPassword := "GoSmtp9x"']
    neg: ['const token = `test_${role}_${Date.now()}`', 'pass the token = "query param or header"', 'url = base + ''?token='' + TOKEN + ''&x=1''', 'password = os.environ["PW"]', 'password = ""', 'password = input()']

  # ===== 5.6 Agent / natural-language disclosures (transcripts, memory files) =====
  - id: nl.password-is
    category: natural_language
    overlap: none
    confidence: low
    severity: medium
    scope: [transcript.user_message, transcript.assistant_message, memory_file, instruction_file, chat_history]
    keywords: [password, passwort, passcode, pin, pw, pwd, token, api key, apikey, mot de passe, contraseña, senha, wachtwoord, hasło]
    require_complexity: true   # value must contain a digit, a symbol, or mixed case (drops 'stored', 'required')
    regex: '(?i)\b(?:password|passwort|kennwort|passcode|pw|pwd|pin|mot\s+de\s+passe|contraseña|contrasena|senha|wachtwoord|hasło|haslo|parola|lösenord|salasana|token|api[\s_-]?key|secret)\s*(?:is|=|:|ist|es|est|é|is\s+now|lautet|for\s+\S+\s+is)\s*[`"''“”]?(?P<secret>[^\s`"''“”,;]{4,})[`"''“”]?(?:[\s,.;)]|$)'
    postprocess: trim_trailing_punctuation   # strip trailing . , ; : ) from the value; keep ! (common in passwords)
    pos: ['the db password is Wint3r2026! — please connect', 'mein Passwort lautet Gehe1m!x', 'staging api key: opaque-77-key', 'connect to the reporting db, the password is Rep0rtDb!2026']
    neg: ['the password is stored in vault', 'password is required', 'the password is $DB_PASSWORD']

  - id: nl.credentials-block
    category: natural_language
    overlap: none
    confidence: medium
    severity: high
    scope: [transcript.user_message, memory_file, instruction_file, plan_file]
    keywords: [username, user, login, password, pass]
    regex: '(?im)^\s*[-*]?\s*(?:user(?:name)?|login|benutzer|email)\s*[:=]\s*\S+\s*\n\s*[-*]?\s*(?:pass(?:word)?|pw|pwd|passwort|kennwort)\s*[:=]\s*[`"'']?(?P<secret>[^\s`"''(<\[{][^\s`"'']{3,})'
    pos: ["Test account:\n- username: qa@acme.io\n- password: QaTest2026!"]
    neg: ["- username: qa@acme.io\n- password: (ask Alice)"]

  # ===== 5.7 Hashes and auth artefacts (gap: not secrets formats in other scanners) =====
  - id: hash.unix-crypt
    category: password_hash
    overlap: none
    confidence: high
    severity: medium
    keywords: ['$1$', '$5$', '$6$', '$y$', '$2a$', '$2b$', '$2y$', '$apr1$', '$argon2', '$pbkdf2', '$scrypt$', '$sha1$', '$md5$', '$7$', '$gy$']
    regex: '(?P<secret>\$(?:1|5|6|y|gy|7|2[abxy]|apr1|md5|sha1|argon2(?:i|d|id)|pbkdf2(?:-sha\d+)?|scrypt)\$[A-Za-z0-9./+=$,:-]{20,})'
    note: 'crackable offline; /etc/shadow lines, htpasswd, DB dumps, usermod -p'
    pos: ['root:$6$rounds=5000$abcdefgh$Hn0XkPxFakeFakeFakeHashValue1234567890abcd:19700:0:99999:7:::', 'admin:$apr1$Q9xk2m1z$FakeApr1HashValue123/.', '$2b$12$FakeBcryptSaltFake.FakeBcryptHashValueFakeFake']
    neg: ['$1$ cost', 'price $5$']

  - id: hash.ntlm-secretsdump
    category: password_hash
    overlap: none
    confidence: high
    severity: high
    keywords: [':::', 'aad3b435b51404eeaad3b435b51404ee']
    regex: '(?im)^(?P<user>[^\s:]+):\d+:(?P<lm>[0-9a-f]{32}):(?P<secret>[0-9a-f]{32}):::'
    pos: ['Administrator:500:aad3b435b51404eeaad3b435b51404ee:31d6cfe0d16ae931b73c59d7e0c089c0:::']
    neg: ['foo:500:bar:baz:::']

  - id: hash.netntlm
    category: password_hash
    overlap: none
    confidence: high
    severity: high
    keywords: ['::']
    regex: '(?i)(?P<user>[\w.$-]+)::(?P<domain>[\w.-]+):(?P<secret>[0-9a-f]{16}:[0-9a-f]{32}:[0-9a-f]{40,})'
    pos: ['jdoe::ACME:1122334455667788:0123456789abcdef0123456789abcdef:0101000000000000c0653150de09d2010a1b2c3d4e5f6789']
    neg: ['a::b']

  - id: hash.kerberos-roast
    category: password_hash
    overlap: none
    confidence: high
    severity: high
    keywords: ['$krb5tgs$', '$krb5asrep$', '$krb5pa$']
    regex: '(?P<secret>\$krb5(?:tgs|asrep|pa)\$\d+\$[^\s]{40,})'
    pos: ['$krb5tgs$23$*svc_sql$ACME.LOCAL$MSSQLSvc/db01*$fakefakefakefakefakefakefakefakefakefakefake$abc']
    neg: ['$krb5tgs$ docs']

  - id: auth.kerberos-ticket-b64
    category: auth_artifact
    overlap: none
    confidence: medium
    severity: high
    keywords: [doif, kirbi, ccache]
    regex: '(?P<secret>doI[A-Za-z0-9+/]{200,}={0,2})'
    note: 'base64 KRB-CRED (Rubeus/kekeo output "doIF...")'
    pos: []
    neg: []

  - id: auth.otpauth-uri
    category: auth_artifact
    overlap: none
    confidence: high
    severity: high
    keywords: ['otpauth://']
    regex: '(?i)otpauth://(?:totp|hotp)/[^\s"''?]*\?[^\s"'']*?secret=(?P<secret>[A-Z2-7=]{16,})'
    pos: ['otpauth://totp/ACME:bob?secret=JBSWY3DPEHPK3PXPJBSWY3DP&issuer=ACME']
    neg: ['otpauth://totp/ACME:bob?issuer=ACME']

  - id: auth.totp-seed-keyword
    category: auth_artifact
    overlap: none
    confidence: medium
    severity: high
    keywords: [totp, 2fa, mfa, otp, authenticator]
    regex: '(?i)\b(?:totp|2fa|mfa|otp|authenticator)[_\s-]*(?:secret|seed|key)\s*[:=]\s*["'']?(?P<secret>[A-Z2-7]{16,}=*)'
    pos: ['TOTP_SECRET=JBSWY3DPEHPK3PXP12AB']
    neg: ['totp secret: <set in app>']

  - id: auth.bip39-mnemonic
    category: auth_artifact
    overlap: partial
    confidence: medium
    severity: critical
    keywords: [mnemonic, seed phrase, recovery phrase, secret recovery]
    regex: '(?i)(?:mnemonic|seed\s*phrase|recovery\s*phrase|secret\s*recovery\s*phrase)\s*[:=]?\s*["'']?(?P<secret>(?:[a-z]{3,8}\s+){11,23}[a-z]{3,8})'
    postprocess: bip39_wordlist_check   # every word must be in the BIP-39 English list
    pos: []
    neg: []

  - id: auth.jwt-in-transcript
    category: auth_artifact
    overlap: partial
    confidence: medium
    severity: medium
    keywords: ['eyj']
    regex: '(?P<secret>eyJ[A-Za-z0-9_-]{10,}\.eyJ[A-Za-z0-9_-]{10,}\.[A-Za-z0-9_-]{10,})'
    postprocess: jwt_decode_check_exp   # report claims (iss, aud, exp); severity down if expired
    note: generic JWT rules exist elsewhere; kept for claim-aware scoring
    pos: []
    neg: []

  # ===== 5.8 SQL statements (heredocs, piped SQL, transcripts, migrations) =====
  - id: sql.create-alter-user
    category: sql_statement
    overlap: none
    confidence: high
    severity: high
    keywords: [identified by, with password, password ', set password, encrypted password, login with]
    regex: '(?i)\b(?:IDENTIFIED\s+(?:WITH\s+\w+\s+)?BY|WITH\s+(?:ENCRYPTED\s+|UNENCRYPTED\s+)?PASSWORD|PASSWORD\s*=|SET\s+PASSWORD\s+(?:FOR\s+\S+\s+)?=)\s*(?:N)?(?:PASSWORD\s*\(\s*)?\\?[''"](?P<secret>[^''"\\]{3,})\\?[''"]'
    pos: ["CREATE USER 'app'@'%' IDENTIFIED BY 'SqlUs3rPw';", "ALTER ROLE etl WITH PASSWORD 'PgRolePw9';", "CREATE LOGIN app WITH PASSWORD = N'MsSqlLogin1!';", "SET PASSWORD FOR 'x'@'%' = 'NewPw2026';"]
    neg: ["ALTER ROLE etl WITH PASSWORD NULL;", "CREATE USER x IDENTIFIED BY :pw"]

  - id: sql.connect-and-dblink
    category: sql_statement
    overlap: none
    confidence: medium
    severity: high
    keywords: [dblink, create server, user mapping, connect to, create secret, pragma key, create database link]
    regex: '(?i)(?:CREATE\s+(?:PUBLIC\s+)?DATABASE\s+LINK\s+\S+\s+CONNECT\s+TO\s+\S+\s+IDENTIFIED\s+BY\s+"?(?P<secret>[^"\s]+)"?|OPTIONS\s*\([^)]*\bpassword\s+''(?P<secret2>[^'']+)''|CREATE\s+(?:PERSISTENT\s+)?SECRET[^;]*?\b(?:SECRET|PASSWORD|TOKEN)\s+''(?P<secret3>[^'']+)''|PRAGMA\s+(?:re)?key\s*=\s*''(?P<secret4>[^'']+)''|dblink_connect\([^)]*password=(?P<secret5>[^\s'')]+))'
    pos: ["CREATE USER MAPPING FOR app SERVER s OPTIONS (user 'r', password 'FdwPw2026');", "CREATE SECRET (TYPE s3, KEY_ID 'AKIAFAKE', SECRET 'DuckS3cr3tVal');", "PRAGMA key = 'SqlCiph3rKey';"]
    neg: ["CREATE SECRET (TYPE s3, PROVIDER credential_chain);"]

# -----------------------------------------------------------------------------
# 6. FILE FORMATS -- credential files with their own structure
# -----------------------------------------------------------------------------
# These run when path_rules mark a file as that format (or content sniffing does).
file_formats:
  - id: fmt.netrc
    paths: ['**/.netrc', '**/_netrc']
    parser: netrc   # tokens: machine/default, login, password, account, macdef
    secret_fields: [password, account]
  - id: fmt.pgpass
    paths: ['**/.pgpass', '**/pgpass.conf']
    parser: colon_fields
    regex: '(?m)^(?P<host>[^:#\n]+):(?P<port>[^:\n]+):(?P<db>[^:\n]+):(?P<user>[^:\n]+):(?P<secret>[^\n]+)$'
  - id: fmt.my-cnf
    paths: ['**/.my.cnf', '**/my.cnf', '**/*.cnf', '**/.mylogin.cnf']
    parser: ini
    secret_keys: [password, pass]
    note: '.mylogin.cnf is AES-obfuscated with a key stored in the file itself -> decodable'
  - id: fmt.docker-config
    paths: ['**/.docker/config.json', '**/containers/auth.json', '**/.dockercfg', '**/podman/auth.json']
    parser: json
    json_paths: ['$.auths.*.auth', '$.auths.*.identitytoken', '$.auths.*.registrytoken', '$.auths.*.password']
    postprocess: {'$.auths.*.auth': base64_decode_userpass}
  - id: fmt.git-credentials
    paths: ['**/.git-credentials', '**/.config/git/credentials']
    note: URI lines; vendor tokens covered elsewhere, but generic https://user:pass@ lines are kept
    regex: '(?m)^https?://(?P<user>[^:\n]+):(?P<secret>[^@\n]+)@(?P<host>\S+)$'
  - id: fmt.git-config
    paths: ['**/.git/config', '**/.gitconfig', '**/.config/git/config']
    parser: ini
    checks: [remote_url_with_credentials, http_extraheader_authorization]
  - id: fmt.kubeconfig
    paths: ['**/.kube/config', '**/kubeconfig', '**/*kubeconfig*.y*ml', '**/k3s.yaml', '**/rke2.yaml']
    parser: yaml
    json_paths: ['$.users[*].user.token', '$.users[*].user.password', '$.users[*].user.client-key-data', '$.users[*].user.auth-provider.config.client-secret', '$.users[*].user.auth-provider.config.refresh-token', '$.users[*].user.auth-provider.config.id-token']
  - id: fmt.aws-files
    paths: ['**/.aws/credentials', '**/.aws/config', '**/.aws/sso/cache/*.json', '**/.aws/cli/cache/*.json']
    parser: ini_or_json
    secret_keys: [aws_secret_access_key, aws_session_token, accessToken, refreshToken, clientSecret, SecretAccessKey, SessionToken]
    overlap: partial
  - id: fmt.azure-cli
    paths: ['**/.azure/msal_token_cache.json', '**/.azure/accessTokens.json', '**/.azure/service_principal_entries.json', '**/.azure/azureProfile.json']
    parser: json
    secret_keys: [secret, refresh_token, access_token, client_secret, client_certificate]
  - id: fmt.gcloud
    paths: ['**/.config/gcloud/application_default_credentials.json', '**/.config/gcloud/legacy_credentials/*/adc.json', '**/.config/gcloud/credentials.db', '**/.config/gcloud/access_tokens.db']
    parser: json_or_sqlite
    secret_keys: [refresh_token, client_secret, private_key, access_token]
  - id: fmt.cli-tokens
    paths: ['**/.config/gh/hosts.yml', '**/.config/glab-cli/config.yml', '**/.config/hub', '**/.config/doctl/config.yaml', '**/.config/hcloud/cli.toml', '**/.fly/config.yml', '**/.netlify/config.json', '**/.config/netlify/config.json', '**/.vercel/auth.json', '**/Library/Application Support/com.vercel.cli/auth.json', '**/.railway/config.json', '**/.config/heroku/*', '**/.wrangler/config/*.toml', '**/.supabase/access-token', '**/.terraform.d/credentials.tfrc.json', '**/.vault-token', '**/.config/argocd/config', '**/.databrickscfg', '**/.snowsql/config', '**/.snowflake/config.toml', '**/.config/snowflake/connections.toml', '**/.pulumi/credentials.json', '**/.config/configstore/firebase-tools.json', '**/.sentryclirc', '**/.npmrc', '**/.yarnrc', '**/.yarnrc.yml', '**/.pypirc', '**/pip.conf', '**/pip.ini', '**/.config/pip/pip.conf', '**/.gem/credentials', '**/.local/share/gem/credentials', '**/.cargo/credentials', '**/.cargo/credentials.toml', '**/.m2/settings.xml', '**/.m2/settings-security.xml', '**/.gradle/gradle.properties', '**/gradle.properties', '**/NuGet.Config', '**/nuget.config', '**/.nuget/NuGet/NuGet.Config', '**/.composer/auth.json', '**/.config/composer/auth.json', '**/auth.json', '**/.bundle/config', '**/.config/rclone/rclone.conf', '**/.s3cfg', '**/.boto', '**/.mc/config.json', '**/.config/mc/config.json', '**/.jfrog/jfrog-cli.conf*', '**/.config/jfrog/*', '**/.ansible/vault*', '**/.vault_pass*', '**/.config/op/config', '**/.config/Bitwarden CLI/data.json', '**/.config/sops/age/keys.txt', '**/.age/*.txt', '**/.config/ngrok/ngrok.yml', '**/.ngrok2/ngrok.yml', '**/.cloudflared/*.json', '**/.config/tailscale/*', '**/.config/openai/*', '**/.config/anthropic/*', '**/.huggingface/token', '**/.cache/huggingface/token', '**/.kaggle/kaggle.json', '**/.config/wandb/settings', '**/.netrc']
    parser: auto
    secret_keys_from: credential_names
  - id: fmt.shell-history
    paths: ['**/.bash_history', '**/.zsh_history', '**/.zhistory', '**/.local/share/fish/fish_history', '**/.histfile', '**/.sh_history', '**/.ash_history', '**/.ksh_history', '**/.python_history', '**/.node_repl_history', '**/.psql_history', '**/.mysql_history', '**/.mariadb_history', '**/.sqlite_history', '**/.rediscli_history', '**/.dbshell', '**/.mongosh/mongosh_repl_history', '**/.lesshst', '**/.irb_history', '**/.pry_history', '**/.julia/logs/repl_history.jl', '**/.Rhistory', '**/.ipython/profile_*/history.sqlite', '**/.cqlsh_history', '**/.influx_history', '**/.wget-hsts', '**/AppData/Roaming/Microsoft/Windows/PowerShell/PSReadLine/ConsoleHost_history.txt', '**/.local/share/powershell/PSReadLine/ConsoleHost_history.txt', '**/.local/share/atuin/history.db', '**/.config/fish/fish_history']
    parser: line_per_command   # zsh extended: ': <ts>:<dur>;cmd' ; fish: '- cmd: ...'
    analyzers: [shell_command, regex_rules, sql_statement]
  - id: fmt.ssh
    paths: ['**/.ssh/config', '**/.ssh/*', '**/ssh_config']
    note: private keys covered elsewhere; here flag 'PasswordAuthentication' plus sshpass wrappers in ProxyCommand/LocalCommand
    analyzers: [shell_command]
  - id: fmt.putty-ppk
    paths: ['**/*.ppk']
    regex: '(?s)PuTTY-User-Key-File-\d+:\s*\S+\s*\nEncryption:\s*none'
    severity: critical
    note: unencrypted PuTTY private key (not a PEM block)
  - id: fmt.remote-desktop-and-ftp-clients
    paths: ['**/FileZilla/sitemanager.xml', '**/FileZilla/recentservers.xml', '**/.config/filezilla/*.xml', '**/WinSCP.ini', '**/.config/remmina/*.remmina', '**/.local/share/remmina/*.remmina', '**/*.rdp', '**/confCons.xml', '**/mRemoteNG/*.xml', '**/.config/transmission*/settings.json', '**/Cyberduck/Bookmarks/*.duck', '**/.config/termius/*', '**/MobaXterm.ini']
    note: 'FileZilla base64 passwords, WinSCP/MobaXterm/mRemoteNG/Remmina obfuscation is reversible -> treat as plaintext'
    secret_keys: [Pass, Password, password, 'password 51:b']
  - id: fmt.db-gui-clients
    paths: ['**/.dbeaver*/**/credentials-config.json', '**/DBeaverData/workspace6/*/.dbeaver/credentials-config.json', '**/DBeaverData/workspace6/*/.dbeaver/data-sources*.json', '**/.config/JetBrains/*/options/dataSources*.xml', '**/.idea/dataSources.xml', '**/.idea/dataSources.local.xml', '**/.idea/workspace.xml', '**/Library/Application Support/TablePlus/*', '**/.config/Beekeeper Studio/*', '**/Library/Containers/com.sequel-ace.*/**', '**/.config/pgadmin/*', '**/.pgadmin/*', '**/.local/share/DBeaverData/**', '**/.azuredatastudio/**', '**/.config/heidisql/*', '**/heidisql/portable_settings.txt', '**/.datagrip/**', '**/.sqldeveloper/**/connections.xml', '**/.mongodb/compass/connections/*.json', '**/Library/Application Support/MongoDB Compass/Connections/*.json', '**/.redisinsight*/**', '**/.robo3t/*.json', '**/.config/dbgate/*']
    note: 'DBeaver credentials-config.json is AES with a public default key -> decodable'
  - id: fmt.api-clients
    paths: ['**/*.postman_environment.json', '**/*.postman_collection.json', '**/.postman/**', '**/insomnia*.json', '**/.insomnia/**', '**/*.bru', '**/bruno.json', '**/environments/*.bru', '**/*.http', '**/*.rest', '**/http-client.env.json', '**/http-client.private.env.json', '**/.thunder-client/**', '**/thunder-tests/**', '**/.httpie/sessions/**/*.json', '**/.config/httpie/sessions/**/*.json', '**/*.har', '**/.hoppscotch/**']
    note: 'Postman env values; Bruno vars:secret; JetBrains http-client.private.env.json; HAR files carry full headers & cookies'
    analyzers: [config_key, http]
  - id: fmt.iac-and-state
    paths: ['**/*.tfstate', '**/*.tfstate.backup', '**/.terraform/terraform.tfstate', '**/*.tfvars', '**/*.auto.tfvars', '**/*.tfplan', '**/Pulumi.*.yaml', '**/.pulumi/stacks/**/*.json', '**/group_vars/**', '**/host_vars/**', '**/inventory*', '**/hosts', '**/*.inventory', '**/values*.yaml', '**/docker-compose*.y*ml', '**/compose*.y*ml', '**/Dockerfile*', '**/*.dockerfile', '**/.gitlab-ci.yml', '**/.github/workflows/*.y*ml', '**/Jenkinsfile', '**/.circleci/config.yml', '**/bitbucket-pipelines.yml', '**/azure-pipelines*.yml', '**/.drone.yml', '**/cloudbuild*.yaml', '**/skaffold.yaml', '**/kustomization.yaml', '**/*secret*.y*ml']
    note: 'tfstate stores sensitive attrs in plaintext; ansible inventory ansible_password=; k8s Secret data: is base64 -> decode'
