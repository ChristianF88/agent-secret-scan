# =============================================================================
# Detection-pattern catalogue for secrets in AI-agent harness files
# -----------------------------------------------------------------------------
# Version: 0.1 (2026-11-07)
#
# Scope ("close the gap"): secrets WITHOUT a recognisable vendor format, found by
# WHERE they sit -- a credential argument in a shell command, a credential env
# var, a credential key in config, a credential slot in a DSN, a credential
# file format, or an agent-specific structure (allow rules, transcripts, MCP
# configs). Vendor token formats (AWS AKIA..., ghp_, glpat-, sk-ant-, xoxb-,
# PEM private-key blocks, ...) are deliberately NOT re-implemented: run
# Betterleaks / TruffleHog for those and use "gap mode" to suppress duplicates.
# Rules that partially overlap with those tools carry `overlap: partial`.
#
# Regex dialect: Rust `regex` crate (RE2-like). No lookaround, no backrefs.
# Every regex rule exposes the credential as named group `secret`; optional
# groups `user`, `host` feed risk scoring. Patterns allow JSON-escaped input
# (values stop at a backslash, so `\"` closes a value inside JSON strings).
#
# Sections
#   1. value_filters        -- shared: references, placeholders, defaults
#   2. credential_names     -- env-var and config-key names that mean "secret"
#   3. shell_semantics      -- how the command analyzer tokenises and recurses
#   4. cli_tools            -- knowledge base of credential-bearing CLI args
#   5. regex_rules          -- text rules, grouped by category
#   6. file_formats         -- structural rules for credential-file formats
#   7. agent_structures     -- where commands/secrets live in agent files
#   8. path_rules           -- agent/harness file locations (from inventory)
# =============================================================================

meta:
  name: agent-secret-patterns
  regex_dialect: rust-regex
  secret_group: secret
  severities: [critical, high, medium, low, info]
  confidence_levels: [high, medium, low]

# -----------------------------------------------------------------------------
# 1. VALUE FILTERS -- applied to every candidate `secret` before reporting
# -----------------------------------------------------------------------------
value_filters:
  # A value that is a reference to a secret, not the secret itself -> drop.
  references:
    - '^\$[A-Za-z_][A-Za-z0-9_]*$'                    # $VAR
    - '^\$\{[^}]+\}$'                                  # ${VAR}, ${VAR:-x}
    - '^\$\([^)]*\)$'                                  # $(cmd)  command substitution
    - '^`[^`]*`$'                                      # `cmd`
    - '^%[A-Za-z_][A-Za-z0-9_]*%$'                     # %VAR% (Windows)
    - '^\$env:[A-Za-z_][A-Za-z0-9_]*$'                 # $env:VAR (PowerShell)
    - '^\{\{.*\}\}$'                                   # {{ templ }} (Jinja, Helm, Go)
    - '^\$\{\{\s*(secrets|vars|env|inputs)\.[^}]+\}\}$' # GitHub Actions
    - '(?i)^(bearer|basic|token|apikey|api-key|digest)\s+(\$\{[^}]+\}|\$[A-Za-z_][A-Za-z0-9_]*|\{\{.*\}\}|<[^<>]+>|%[A-Za-z_]+%)$'  # scheme + reference
    - '^<[^<>]{1,64}>$'                                # <password>, <YOUR_TOKEN>
    - '^\[[A-Z_ ]{3,40}\]$'                            # [PASSWORD]
    - '^!vault\b'                                      # Ansible vault
    - '^ENC\(.+\)$'                                    # jasypt
    - '^(vault|op|sm|ssm|akv|keyvault|gcpsm|doppler|infisical|bws)://'  # secret-manager URIs
    - '^arn:aws:(secretsmanager|ssm):'
    - '^(process\.env|os\.environ|os\.getenv|System\.getenv|ENV\[|getenv\()'
    - '^(file|/run/secrets/|/var/run/secrets/)'
    - '^@?[\w./~-]+\.(pem|key|p12|pfx|jks|keystore|txt|json|cred|creds|secret)$'  # path to a file
    - '^\*{3,}$'                                       # *** (already masked)
    - '^(x{3,}|X{3,}|•+|\.{3,})$'
    - '(?i)^(redacted|masked|hidden|omitted|removed)$'
    - '(?i)^\[(redacted|masked|hidden|filtered)\]$'
    - '\[redacted\]$'                                   # this tool's own redacted output (Qw…[redacted])
    - '^\{[A-Za-z_][A-Za-z0-9_.:-]*\}$'                # {VALUE}, {env:X} (format strings, opencode refs)
    # Code expressions, not literals (config-key rules see source code too):
    - '^[A-Za-z_][A-Za-z0-9_:.]*(?:\(.*\)|<.*>)[,;]?$'     # Secret::new(v), Vec<usize>, foo.bar()
    - '\s(?:==|!=|=>|->|&&|\|\|)\s'                     # c.kind == X, a && b
    - '^(?:if|match|return|await|let|const|var|new)\s'    # if self.show {
    - '(?i)^(?:bool|boolean|str|&str|string|int|integer|float|number|object|any|usize|isize|u8|u16|u32|u64|i32|i64|f32|f64|none|null|nil|true|false)[,;]$'
    - '^[A-Za-z_][A-Za-z0-9_]*(?:\.[A-Za-z_][A-Za-z0-9_]*)+[,;]$'   # f.default_credential,
    - '^[a-z_$][A-Za-z0-9_$]*,$'                                     # "secret": shown, password: hashedPassword,  (identifier)
    - '^\[\s*[A-Za-z_$][\w$.]*!?\s*[\],]'                              # array of identifiers: [process.env.SESSION_SECRET!]
    - '^[A-Z][A-Za-z]*(?:State|Type|Context|Service|Provider|Config|Options|Props|Params|Manager|Client|Handler|Interface|Schema|Model|Store|Info|Data)[,;]?$'  # a type name: auth: AuthState
    # Found in real agent files (2026-11-07 integration run over 19 public repos):
    - '\$\{[^}]*\}'                                    # template interpolation anywhere: `Bearer ${token}`, https://${domain}/x, ${{ secrets.X }} # comment
    - '^\$[A-Za-z_][A-Za-z0-9_]*(?:\[|->|\.)'             # $data['password'], $this->token (PHP / shell access)
    - '^[A-Za-z_$][\w$]*(?:(?:\?\.|\.|::)[\w$]+|\[[^\]]*\])*\s*\('   # call expression, closed or not: getApiKey(, z.string().min(8, keys[n].apiKey.trim()
    - '^[A-Za-z_$][\w$]*(?:\.[\w$]+)*(?:\?\.[\w$]+|\[[^\]]+\])'      # optional chaining / index: this.config?.github?.token, keys[name].apiKey
    - '^\((?:[A-Za-z_$][\w$.]*\(|process\.env|os\.environ)'  # (F.datediff(..) < 0), (os.environ.get(..) or "")
    - '\s(?:\?\?|\+|-|\||=|as|or|and)\s'             # binary operators: a ?? b, userTokens + assistantTokens, str | None = None, x as number
    - '^\+\s|\s\+$|^\(\)\s*=>|=>\s*$'                # "+ TOKEN +", () =>
    - '^\{\s*["''\w]+\s*[:=]'                          # object literal: { type: "string" }, { workspace = true }
    - '^\[\s*["'']'                                    # array literal: ["command", "pass", "show", "x"]
    - '(?i)^(?:readonly\s+)?(?:string|number|bool|boolean|str|int|integer|float|object|any)\b\s*(?:\(|\||\[|\)|:)'  # types: string (required), number | "inf", readonly string[]
    - '^\|'                                             # markdown table row
    - '^[A-Za-z_][\w-]*:\s'                             # nested key on the same line: type: http, username: "testuser"
    - '^(?:pass|gopass|op|bw|secret-tool|security)\s+(?:show|read|get|lookup|find-generic-password)\b'  # password-manager command
    - '^(?:\$HOME|\$\{HOME\}|~)/'                       # path under home
    - '^[A-Za-z_$]+(?:\.[A-Za-z_$]+){2,}$'                # member chain without digits: data.server.password (JWTs have digits)
    - '^(?:this|self|state|info|data|config|cfg|ctx|req|res|env|opts|options|args|params|props|settings|process|session|user|auth)\.[A-Za-z_$][\w$.]*$'  # state.token, self.api_key
  # Obvious placeholders -> drop (case-insensitive exact match after trim).
  placeholders:
    [password, passwd, pass, pwd, secret, token, apikey, api_key, key, changeme,
     change_me, replace_me, replaceme, your_password, yourpassword, your-password,
     your_token, your_api_key, my_password, mypassword, example, sample, dummy,
     fake, test, testing, placeholder, todo, tbd, none, "null", nil, undefined,
     empty, "true", "false", "yes", "no", "0", "1", required, optional, string,
     value, foo, bar, baz, xxx, "...", "-", stdin, prompt, x, "…", jwt, n/a, not_needed,
     not-needed, not_set, "(none)", bearer, basic]
  # Placeholders by shape (regexes; a match drops the value). From the
  # 2026-11-07 integration run: setup docs and agent instruction files.
  placeholder_patterns:
    - '(?i)(?:^|[^a-z0-9])(?:your|insert|enter|paste|replace)[_ -]'   # your-api-key, YOUR_KEY, ghp_your_token, https://your-sentry-dsn, =pk.your-token
    - '(?i)[_-](?:goes_)?here$'                                      # OPENAI_API_KEY_HERE, api_key_goes_here
    - '(?i)(?:(?:^|[_.-])x{3,}(?:[_.-]|$)|x{6,})'                     # ghp_xxx, glpat-xxxxxxxx, sk-proj-XXXXXXXXXXXX
    - '\.\.\.|…'                                                     # truncated: sk-..., AIzaSy...BwM, eyJhbGci...
    - '(?i)^(?:[a-z]{1,6}[_-])?(?:test|demo|sample|dummy|fake|example)[_@-]?(?:pass(?:word)?|pwd|secret|key|token|api[_-]?key|user)?[_@-]?\d{0,6}!?$'  # test-key, sk-test123, testpass123, Test@123
    - '^[A-Z][A-Z0-9]*(?:_[A-Z0-9]+)+$'                              # an env var NAME as the value: YOUR_CLAUDE_API_KEY, OPENAI_API_KEY
    - '(?i)^(?:[a-z]+[_-])+(?:token|secret|key|password|passwd|pwd|credential)s?$'   # descriptive names as values: jwt_token, refresh_token, db-password
    - '(?i)^(?:(?:secure|strong|super|new|old|valid|invalid|wrong|correct|good|bad|weak|my|user|admin|test|demo|sample)[_-]?)*pass(?:word|wd)?[_-]?\d{0,6}[!@#.]?$'  # Password123, securepassword123, ValidPass123!
    - '^[\^~>=<]*v?\d+(?:\.\d+){1,3}(?:-[\w.]+)?[,;]?$'               # a version: ^9.0.0, ~1.2, v2.3.4-beta.1
  # Well-known default/weak credentials: KEEP, but report as `default_credential`
  # (severity low unless paired with a non-local host).
  defaults:
    [changeit, admin, root, toor, postgres, mysql, guest, letmein, password1,
     Password1, P@ssw0rd, 123456, 12345678, qwerty, secret123, minioadmin,
     sa, oracle, tiger, manager, welcome, welcome1, default]
  # Minimum length after filtering (human passwords can be short; tokens not).
  min_length: { password: 4, token: 12, key: 12 }
  # Hosts that lower severity (local / documentation ranges).
  local_hosts:
    - '^(localhost|127\.\d+\.\d+\.\d+|::1|0\.0\.0\.0|host\.docker\.internal)$'
    - '\.(local|localhost|test|example|invalid|internal)$'
    - '^(10|192\.168|172\.(1[6-9]|2\d|3[01]))\.'      # RFC1918
    - '^(192\.0\.2|198\.51\.100|203\.0\.113)\.'        # RFC5737 documentation
    - '(^|\.)example\.(com|org|net)$'

# -----------------------------------------------------------------------------
# 2. CREDENTIAL NAMES -- shared by env-assignment, config-key and k=v rules
# -----------------------------------------------------------------------------
credential_names:
  # Exact names (case-insensitive) that always denote a credential.
  exact_env:
    # databases
    [PGPASSWORD, PGPASS, MYSQL_PWD, MYSQL_PASSWORD, MYSQL_ROOT_PASSWORD,
     MARIADB_PASSWORD, MARIADB_ROOT_PASSWORD, POSTGRES_PASSWORD, POSTGRESQL_PASSWORD,
     REDISCLI_AUTH, REDIS_PASSWORD, MONGO_INITDB_ROOT_PASSWORD, MONGODB_PASSWORD,
     SA_PASSWORD, MSSQL_SA_PASSWORD, MSSQL_PASSWORD, ORACLE_PASSWORD, ORACLE_PWD,
     APP_USER_PASSWORD, ELASTIC_PASSWORD, KIBANA_PASSWORD, OPENSEARCH_INITIAL_ADMIN_PASSWORD,
     NEO4J_AUTH, NEO4J_PASSWORD, INFLUXDB_ADMIN_PASSWORD, DOCKER_INFLUXDB_INIT_PASSWORD,
     DOCKER_INFLUXDB_INIT_ADMIN_TOKEN, CLICKHOUSE_PASSWORD, COUCHDB_PASSWORD,
     CASSANDRA_PASSWORD, RABBITMQ_DEFAULT_PASS, RABBITMQ_PASSWORD, SNOWSQL_PWD,
     SNOWFLAKE_PASSWORD, TRINO_PASSWORD, DATABRICKS_TOKEN, DATABRICKS_PASSWORD,
     # remote access / infra
     SSHPASS, IPMI_PASSWORD, GOVC_PASSWORD, VSPHERE_PASSWORD, VCENTER_PASSWORD,
     OS_PASSWORD, OS_TOKEN, PROXMOX_PASSWORD, PM_PASS, LIBVIRT_PASSWORD,
     # backup / crypto
     RESTIC_PASSWORD, BORG_PASSPHRASE, PASSPHRASE, GPG_PASSPHRASE,
     KOPIA_PASSWORD, RCLONE_CONFIG_PASS, AGE_KEY, SOPS_AGE_KEY,
     # registries / packages / CI
     DOCKER_PASSWORD, DOCKER_AUTH_CONFIG, REGISTRY_PASSWORD, CI_REGISTRY_PASSWORD,
     HARBOR_PASSWORD, NPM_TOKEN, NODE_AUTH_TOKEN, NPM_PASSWORD, YARN_NPM_AUTH_TOKEN,
     TWINE_PASSWORD, UV_PUBLISH_PASSWORD, UV_PUBLISH_TOKEN, PYPI_TOKEN, POETRY_PYPI_TOKEN_PYPI,
     GEM_HOST_API_KEY, CARGO_REGISTRY_TOKEN, NUGET_API_KEY, NUGET_PASSWORD,
     MAVEN_PASSWORD, GRADLE_PUBLISH_SECRET, ORG_GRADLE_PROJECT_SIGNINGPASSWORD,
     JFROG_PASSWORD, ARTIFACTORY_PASSWORD, ARTIFACTORY_API_KEY, NEXUS_PASSWORD,
     SONAR_TOKEN, SONAR_PASSWORD, SONAR_LOGIN, JENKINS_API_TOKEN, JENKINS_PASSWORD,
     GH_TOKEN, GITHUB_TOKEN, GITHUB_PAT, GH_ENTERPRISE_TOKEN, GITLAB_TOKEN,
     GITLAB_PRIVATE_TOKEN, GL_TOKEN, CI_JOB_TOKEN, BITBUCKET_APP_PASSWORD,
     # hashicorp / orchestration
     VAULT_TOKEN, VAULT_PASSWORD, CONSUL_HTTP_TOKEN, NOMAD_TOKEN, BOUNDARY_PASSWORD,
     KUBE_TOKEN, K8S_AUTH_TOKEN, ARGOCD_AUTH_TOKEN, ARGOCD_PASSWORD,
     ANSIBLE_PASSWORD, ANSIBLE_BECOME_PASS, ANSIBLE_BECOME_PASSWORD, ANSIBLE_SSH_PASS,
     ANSIBLE_VAULT_PASSWORD, TF_TOKEN, TFE_TOKEN, ATLAS_TOKEN,
     # cloud (format-less parts)
     AWS_SECRET_ACCESS_KEY, AWS_SESSION_TOKEN, AZURE_CLIENT_SECRET, ARM_CLIENT_SECRET,
     ARM_ACCESS_KEY, AZURE_STORAGE_KEY, AZURE_STORAGE_ACCOUNT_KEY,
     AZURE_STORAGE_CONNECTION_STRING, AZURE_STORAGE_SAS_TOKEN, AZURE_DEVOPS_EXT_PAT,
     AZURE_PASSWORD, GOOGLE_CLIENT_SECRET, CLOUDSDK_AUTH_ACCESS_TOKEN,
     DIGITALOCEAN_ACCESS_TOKEN, LINODE_TOKEN, HCLOUD_TOKEN, VULTR_API_KEY,
     MINIO_ROOT_PASSWORD, MINIO_SECRET_KEY, MC_HOST_*, S3_SECRET_KEY,
     # app frameworks
     SECRET_KEY, SECRET_KEY_BASE, DJANGO_SECRET_KEY, FLASK_SECRET_KEY, APP_KEY,
     APP_SECRET, JWT_SECRET, JWT_SECRET_KEY, JWT_PRIVATE_KEY, NEXTAUTH_SECRET,
     AUTH_SECRET, SESSION_SECRET, COOKIE_SECRET, ENCRYPTION_KEY, MASTER_KEY,
     RAILS_MASTER_KEY, SPRING_DATASOURCE_PASSWORD, SPRING_MAIL_PASSWORD,
     DB_PASSWORD, DB_PASS, DB_PWD, DATABASE_PASSWORD, DATABASE_URL,
     SMTP_PASSWORD, SMTP_PASS, MAIL_PASSWORD, EMAIL_PASSWORD, EMAIL_HOST_PASSWORD,
     LDAP_PASSWORD, LDAP_BIND_PASSWORD, LDAP_ADMIN_PASSWORD, BIND_PW,
     # mobile signing / Apple
     KEYSTORE_PASSWORD, STORE_PASSWORD, KEY_PASSWORD, SIGNING_KEY_PASSWORD,
     SIGNING_STORE_PASSWORD, ANDROID_KEYSTORE_PASSWORD, ANDROID_KEY_PASSWORD,
     MATCH_PASSWORD, FASTLANE_PASSWORD, FASTLANE_SESSION,
     FASTLANE_APPLE_APPLICATION_SPECIFIC_PASSWORD, APPLE_APP_SPECIFIC_PASSWORD,
     APP_STORE_CONNECT_API_KEY_CONTENT, CERTIFICATE_PASSWORD, P12_PASSWORD,
     # AI providers (format-less or often pasted bare)
     OPENAI_API_KEY, ANTHROPIC_API_KEY, ANTHROPIC_AUTH_TOKEN, GEMINI_API_KEY,
     GOOGLE_API_KEY, AZURE_OPENAI_API_KEY, MISTRAL_API_KEY, GROQ_API_KEY,
     DEEPSEEK_API_KEY, OPENROUTER_API_KEY, TOGETHER_API_KEY, FIREWORKS_API_KEY,
     COHERE_API_KEY, PERPLEXITY_API_KEY, XAI_API_KEY, HF_TOKEN, HUGGING_FACE_HUB_TOKEN,
     REPLICATE_API_TOKEN, LANGSMITH_API_KEY, LANGCHAIN_API_KEY, PINECONE_API_KEY,
     DASHSCOPE_API_KEY, MOONSHOT_API_KEY, ZHIPU_API_KEY, QWEN_API_KEY,
     # MCP-server typical
     BRAVE_API_KEY, TAVILY_API_KEY, EXA_API_KEY, FIRECRAWL_API_KEY, SERPAPI_API_KEY,
     SLACK_BOT_TOKEN, SLACK_USER_TOKEN, NOTION_API_KEY, NOTION_TOKEN, LINEAR_API_KEY,
     JIRA_API_TOKEN, CONFLUENCE_API_TOKEN, ATLASSIAN_API_TOKEN, SENTRY_AUTH_TOKEN,
     FIGMA_ACCESS_TOKEN, FIGMA_API_KEY, SUPABASE_SERVICE_ROLE_KEY, SUPABASE_ACCESS_TOKEN,
     NEON_API_KEY, PLANETSCALE_PASSWORD, POSTMAN_API_KEY, STRIPE_SECRET_KEY,
     TWILIO_AUTH_TOKEN, SENDGRID_API_KEY, MAILGUN_API_KEY, CLOUDFLARE_API_TOKEN,
     CF_API_KEY, VERCEL_TOKEN, NETLIFY_AUTH_TOKEN, FLY_API_TOKEN, RAILWAY_TOKEN,
     RENDER_API_KEY, HEROKU_API_KEY, DATADOG_API_KEY, DD_API_KEY, DD_APP_KEY,
     NEW_RELIC_LICENSE_KEY, NEW_RELIC_API_KEY, GRAFANA_API_KEY, GRAFANA_SERVICE_ACCOUNT_TOKEN,
     PAGERDUTY_TOKEN, BROWSERBASE_API_KEY, E2B_API_KEY, DAYTONA_API_KEY]
  # Suffix/infix patterns for env vars and config keys (applied to the NAME).
  name_patterns:
    - '(?i)(^|[_.-])(pass(word|wd|phrase)?|pwd|pw|passcode|pin)$'
    - '(?i)(^|[_.-])(secret|secrets|secret_?key|client_?secret|app_?secret|shared_?secret|webhook_?secret|signing_?secret)$'
    - '(?i)(^|[_.-])(api_?key|apikey|access_?key|secret_?access_?key|account_?key|master_?key|private_?key|signing_?key|encryption_?key|enc_?key|license_?key)$'
    - '(?i)(^|[_.-])(token|access_?token|auth_?token|bearer_?token|refresh_?token|id_?token|session_?token|api_?token|pat|oauth_?token|app_?password)$'
    - '(?i)(^|[_.-])(credential|credentials|creds|auth|authorization|basic_?auth|http_?auth)$'
    - '(?i)(^|[_.-])(conn(ection)?_?str(ing)?|dsn|database_?url|db_?url|jdbc_?url|redis_?url|mongo(db)?_?ur[il]|amqp_?url|broker_?url)$'
    - '(?i)(^|[_.-])(salt|pepper|hmac(_?key)?|cookie_?secret|session_?key)$'
    # camelCase / PascalCase variants (config keys)
    - '^(?:[A-Za-z][A-Za-z0-9]*)?(Password|Passwd|Passphrase|Secret|SecretKey|ClientSecret|ApiKey|APIKey|AccessKey|AccountKey|PrivateKey|SigningKey|Token|AccessToken|RefreshToken|AuthToken|SessionToken|ConnectionString|Credentials)$'
    - '^(password|passwd|passphrase|secret|apiKey|accessToken|refreshToken|clientSecret|privateKey|connectionString)$'
    # header-style keys
    - '(?i)^(authorization|proxy-authorization|cookie|x-api-key|x-auth-token|x-access-token|x-api-token|api-key|private-token|job-token|x-gitlab-token|x-vault-token|x-consul-token|x-goog-api-key|ocp-apim-subscription-key|x-functions-key|x-rapidapi-key)$'
    # registry / package-manager keys
    - '(?i)^(_auth|_authtoken|_password|npmauthtoken|npmauthident|always-auth-token)$'
    - '(?i)(^|[.:/])_auth(token)?$'          # //registry.npmjs.org/:_authToken
    # JVM / Kafka / Spring style dotted keys
    - '(?i)\.(password|secret|token|key-?password|store-?password|keystore-?password|truststore-?password|jaas\.config)$'
  # Names that look like credential names but are not credentials -> skip.
  name_exclusions:
    - '(?i)(_|\.|-)(file|path|dir|location|env|env_?vars?|name|names|id|ids|length|len|min|max|policy|prompt|hint|label|type|mode|enabled|disabled|required|reset|expiry|expires?|ttl|url_template|field|header_name|regex|pattern|count|hash_algo)$'
    - '(?i)^(token_?type|grant_?type|auth_?type|auth_?method|password_?(hash|policy|reset|strength|min_length)|secret_?name|key_?id|key_?name|access_?key_?id|client_?id|api_?key_?id|keyid|kid)$'
    - '(?i)(?:^|[_.-])(max_?tokens|tokens?_?(used|count|limit)|input_?tokens|output_?tokens|cache_\w*tokens|token_?budget|tokenizer)$'   # LLM token *counts*, frequent in agent logs
    - '(?i)tokens$|^tokeniz'                                  # plural = counts (MAX_TOKENS, cached_tokens, totalTokens); tokenize
    - '(?i)token_?(?:count|estimate|cap|limit|budget|usage|threshold|ratio|length|size)s?$'   # promptTokenCount, PROMPT_TOKEN_CAP
    - '(?i)(?:error|exception)s?$'                            # InvalidCredentialsError
    - '(?i)pass(?:ed|es|ing)$|bypass|compass|passage|passenger' # date_passed, bypass_auth
    - '(?i)^(public_?key|pubkey|publickey|cert|certificate|ca_?cert|fingerprint)$'
    - '(?i)(?:^|[_.-])(?:co-)?author(?:s|ed|ed-by|ity)?$'   # Co-Authored-By, OIDC authority; NOT Authorization

# -----------------------------------------------------------------------------
# 3. SHELL SEMANTICS -- command analyzer behaviour
# -----------------------------------------------------------------------------
shell_semantics:
  tokenizer:
    quoting: [single, double, ansi_c ($'...'), backslash]   # input is already decoded (JSON strings by the extractors)
    subshell: ['(', ')']
    split_operators: ['&&', '||', ';', '|', '|&', '&', newline]
    redirections_ignored: ['>', '>>', '<', '2>', '&>', '2>&1']
    heredoc: { syntax: ['<<EOF', "<<'EOF'", '<<-EOF'], scan_body_with: [sql_statements, regex_rules] }
    here_string: '<<<'
  # Leading `NAME=value` words before the command are env assignments
  # (checked against credential_names).
  env_prefix: true
  # Wrappers whose remaining argv is another command -> recurse.
  wrappers:
    passthrough: [sudo, doas, env, nohup, time, timeout, nice, ionice, stdbuf,
                  xargs, watch, exec, command, builtin, chroot, unbuffer, caffeinate,
                  strace, ltrace, gdb --args, valgrind, firejail, flock, setsid,
                  dotenv, sshpass, op run --, doppler run --, infisical run --, aws-vault exec,
                  npx, pnpm dlx, bunx, uvx, pipx run, poetry run, uv run, bundle exec]
    string_arg:            # the command is inside ONE string argument
      - {cmd: [bash, sh, zsh, dash, ksh, fish, busybox sh], flag: -c}
      - {cmd: [su], flag: -c}
      - {cmd: [ssh], arg: 'after host'}           # ssh host 'cmd ...'
      - {cmd: [powershell, pwsh, powershell.exe, pwsh.exe], flag: [-Command, -c]}
      - {cmd: [cmd, cmd.exe], flag: [/c, /k]}
      - {cmd: [eval], arg: all}
      - {cmd: [script], flag: -c}
      - {cmd: [tmux, screen], subcommand: [send-keys, -X stuff], arg: all}
    after_double_dash:     # `... -- cmd args`
      [kubectl exec, oc exec, docker exec, podman exec, nerdctl exec, lxc exec,
       incus exec, multipass exec, vagrant ssh -c, gcloud compute ssh --command,
       aws ssm send-command --parameters, az vm run-command invoke --scripts]
    container_exec_after_container_name: [docker exec, podman exec, docker run, podman run, docker compose exec, docker-compose exec]
  # Wrapper flags that take a separate value, so the analyzer skips the value
  # while looking for the host, container or wrapped command. A flag in
  # neither list follows `unlisted` (boolean | value; default boolean); short
  # clusters (`-it`, `-p2222`) and `--flag=value` never take a separate value.
  # Separate-value flags of a wrapper's own `cli_tools` entry (`sshpass -p`)
  # are added automatically.
  value_flags:
    - {cmd: [ssh], value: [-B, -b, -c, -D, -E, -e, -F, -I, -i, -J, -L, -l, -m, -O, -o, -P, -p, -Q, -R, -S, -W, -w]}
    - cmd: [docker, podman, docker-compose, nerdctl]
      boolean: [--rm, --privileged, --init, --interactive, --tty, --detach, --read-only, --no-deps,
                --service-ports, --use-aliases, --no-TTY, --quiet, --sig-proxy, --no-healthcheck,
                -i, -t, -d, -P, -T, -q]
      unlisted: value
    - {cmd: [tmux, screen], boolean: [-l, -R, -M, -H, -K], unlisted: value}
    - {cmd: [sudo], value: [-u, -g, -C, -D, -h, -p, -r, -t, -U, -T, --user, --group, --chdir, --prompt, --host, --role, --type, --other-user, --close-from, --command-timeout]}
    - {cmd: [doas], value: [-u, -C]}
    - {cmd: [env], value: [-u, --unset, -C, --chdir]}
    - {cmd: [timeout], value: [-s, --signal, -k, --kill-after]}
    - {cmd: [nice], value: [-n, --adjustment]}
    - {cmd: [ionice], value: [-c, -n, -p, --class, --classdata]}
    - {cmd: [stdbuf], value: [-i, -o, -e]}
    - {cmd: [xargs], value: [-a, -d, -E, -I, -L, -n, -P, -s, --arg-file, --delimiter, --max-args, --max-procs]}
    - {cmd: [watch], value: [-n, --interval]}
    - {cmd: [flock], value: [-w, --timeout, -E, --conflict-exit-code]}
    - {cmd: [chroot], value: [--userspec, --groups]}
    - {cmd: [strace, ltrace], value: [-o, -e, -p, -s, -u, -E, -P, -I]}
    - {cmd: [sshpass], value: [-f, -d, -P]}
  # Pipelines that feed a literal secret into a stdin consumer:
  #   echo|printf|cat<<< 'SECRET' | <sink>
  # payload: args (its arguments) | printf (the argument after a `%` format,
  # else the format) | stdin (its own here-string or heredoc). A here-string
  # or heredoc on the sink itself always counts.
  stdin_sources:
    - {cmd: echo, payload: args, flags: [-n, -e, -E]}
    - {cmd: yes, payload: args}
    - {cmd: printf, payload: printf}
    - {cmd: cat, payload: stdin}
  # payload: secret (first line; default) | token (first line) | userpass
  # (every `user:pass` line) | sql (left to the SQL/regex rules).
  # Wrappers (`sudo`, `env`, ...) before the sink are resolved first.
  stdin_sinks:
    - {cmd: [docker login, podman login, buildah login, nerdctl login, helm registry login, oras login, crane auth login], flag: --password-stdin}
    - {cmd: [sudo], flag: -S}
    - {cmd: [chpasswd], payload: userpass}    # echo 'user:pass' | chpasswd  -> secret after ':'
    - {cmd: [passwd], flag: --stdin}
    - {cmd: [gh auth login], flag: --with-token, payload: token}
    - {cmd: [glab auth login], flag: --stdin, payload: token}
    - {cmd: [kinit]}
    - {cmd: [vault login], arg: '-', payload: token}
    - {cmd: [openssl], flag: -passin stdin}
    - {cmd: [cryptsetup], flag: [luksOpen, open, luksFormat]}
    - {cmd: [gpg], flag: [--passphrase-fd 0, --batch --passphrase-fd]}
    - {cmd: [sshfs], flag: '-o password_stdin'}
    - {cmd: [mysql_config_editor]}
    - {cmd: [htpasswd], flag: -i}
    - {cmd: [smbpasswd], flag: -s}
    - {cmd: [wpa_passphrase]}
    - {cmd: [psql, mysql, sqlplus, sqlcmd, mongosh, redis-cli], payload: sql, note: 'SQL/commands piped in: scan body with sql_statements rules'}
  # Arguments that are KEY=VALUE pairs where KEY is checked against credential_names.
  keyvalue_arg_tools:
    [terraform -var, tofu -var, packer -var, ansible -e, ansible-playbook -e,
     ansible-playbook --extra-vars, helm --set, helm --set-string, helm install --set,
     kubectl create secret --from-literal, vault kv put, vault write, vault login -method,
     flyctl secrets set, fly secrets set, heroku config:set, dokku config:set,
     railway variables --set, render env set, gh variable set, k6 -e, newman --env-var,
     docker run -e, docker run --env, podman run -e, docker build --build-arg,
     docker compose run -e, mvn -D, gradle -D, gradle -P, java -D, spring-boot --,
     make, sbt -D, dotnet run --, npm config set, yarn config set, pnpm config set,
     git -c, git config, pip config set, poetry config, cargo --config, sonar-scanner -D]

# -----------------------------------------------------------------------------
# 4. CLI KNOWLEDGE BASE -- credential-bearing arguments per tool
# -----------------------------------------------------------------------------
# form:
#   attached          -pSECRET           (no space; `-p` alone or `-p x` means something else)
#   separate          -p SECRET
#   attached_or_separate
#   equals            --password=SECRET
#   equals_or_separate --password=SECRET | --password SECRET
#   colon             /p:SECRET  (Windows / FreeRDP style)
#   positional        n-th non-flag argument (index, 1-based, after subcommand)
# kind:
#   password | token | key | passphrase
#   userpass:<sep>    value is user<sep>pass ; secret = part after first <sep>
#   connect:<syntax>  value is a connect string; parse with file_formats/regex_rules
#   keyvalue          value is NAME=VAL ; check NAME against credential_names
# names (keyvalue kinds): credential (default; NAME must be a credential name)
#   | any (every NAME counts; non-credential names get medium confidence)
# Every `subcommand` scope matters: e.g. `docker run -p` is a port mapping,
# `docker login -p` is a password.
cli_tools:
  # ---------------- relational & analytical databases ----------------
  - tool: mysql
    aliases: [mariadb, mysqldump, mysqladmin, mysqlimport, mysqlshow, mysqlcheck, mysqlpump, mysqlbinlog, mysqlslap, mariadb-dump, mariadb-admin, mariadb-import, mariadb-check]
    args:
      - {flag: -p, form: attached, kind: password, note: "'-p' alone prompts; '-p db' means db name"}
      - {flag: --password, form: equals, kind: password}
    env: [MYSQL_PWD]
  - tool: mysqlsh
    args: [{flag: --password, form: equals, kind: password}, {flag: -p, form: attached, kind: password}, {flag: --uri, form: equals_or_separate, kind: 'connect:uri'}]
  - tool: psql
    aliases: [pg_dump, pg_dumpall, pg_restore, pg_basebackup, pg_isready, createdb, dropdb, createuser, dropuser, vacuumdb, reindexdb, clusterdb, pgbench, pg_receivewal, pg_recvlogical]
    args:
      - {position: any, form: positional, kind: 'connect:libpq_keyvalue', note: "conninfo 'host=.. password=..'"}
      - {flag: -d, form: separate, kind: 'connect:libpq_keyvalue'}
      - {flag: --dbname, form: equals_or_separate, kind: 'connect:libpq_keyvalue'}
    env: [PGPASSWORD, PGPASS]
  - tool: sqlcmd
    aliases: [bcp, osql, isql, mssql-cli, go-sqlcmd]
    args: [{flag: -P, form: attached_or_separate, kind: password}, {flag: --password, form: equals_or_separate, kind: password}]
    env: [SQLCMDPASSWORD]
  - tool: sqlplus
    aliases: [sql, rman, expdp, impdp, exp, imp, dgmgrl, sqlldr, tkprof, orapki, adrci]
    args: [{position: 1, form: positional, kind: 'connect:oracle_userpass', note: 'user/pass@db ; also "/ as sysdba" (no secret)'}]
    sql_statements: true
  - tool: db2
    args: [{pattern: 'connect to \S+ user \S+ using (?P<secret>\S+)', kind: password}]
  - tool: clickhouse-client
    aliases: [clickhouse client, clickhouse-local]
    args: [{flag: --password, form: equals_or_separate, kind: password}]
    env: [CLICKHOUSE_PASSWORD]
  - tool: cqlsh
    args: [{flag: -p, form: separate, kind: password}, {flag: --password, form: equals_or_separate, kind: password}]
  - tool: nodetool
    args: [{flag: -pw, form: separate, kind: password}, {flag: --password, form: equals_or_separate, kind: password}]
  - tool: cypher-shell
    args: [{flag: -p, form: separate, kind: password}, {flag: --password, form: equals_or_separate, kind: password}]
    env: [NEO4J_PASSWORD]
  - tool: neo4j-admin
    args: [{subcommand: 'dbms set-initial-password', position: 1, form: positional, kind: password}, {subcommand: set-initial-password, position: 1, form: positional, kind: password}]
  - tool: arangosh
    aliases: [arangodump, arangorestore, arangoimport, arangoexport]
    args: [{flag: --server.password, form: equals_or_separate, kind: password}]
  - tool: influx
    args:
      - {flag: -password, form: separate, kind: password, note: v1}
      - {flag: --password, form: equals_or_separate, kind: password}
      - {flag: -t, form: separate, kind: token}
      - {flag: --token, form: equals_or_separate, kind: token}
    env: [INFLUX_TOKEN, INFLUX_PASSWORD]
  - tool: couchbase-cli
    aliases: [cbq, cbimport, cbexport, cbbackupmgr, cbstats]
    args: [{flag: -p, form: separate, kind: password}, {flag: --password, form: equals_or_separate, kind: password}, {flag: --bucket-password, form: equals_or_separate, kind: password}]
  - tool: beeline
    args: [{flag: -p, form: separate, kind: password}, {flag: -u, form: separate, kind: 'connect:jdbc'}]
  - tool: isql-fb
    aliases: [isql (firebird), gbak, gfix, gsec]
    args: [{flag: -p, form: separate, kind: password}, {flag: -password, form: separate, kind: password}, {flag: -pas, form: separate, kind: password}]
    env: [ISC_PASSWORD]
  - tool: snowsql
    args: [{flag: --password, form: equals_or_separate, kind: password}]
    env: [SNOWSQL_PWD]
  - tool: snow
    args: [{flag: --password, form: equals_or_separate, kind: password}, {flag: --token, form: equals_or_separate, kind: token}]
  - tool: trino
    aliases: [presto, presto-cli, trino-cli]
    env: [TRINO_PASSWORD, PRESTO_PASSWORD]
  - tool: usql
    args: [{position: 1, form: positional, kind: 'connect:uri'}]
  - tool: duckdb
    sql_statements: true
    note: "CREATE SECRET (TYPE s3, KEY_ID '..', SECRET '..') inside -c/SQL"
  - tool: sqlite3
    note: no credentials; only SQLCipher `PRAGMA key = '...'` (see sql_statements)
  # ---------------- key-value, document, queues, streaming ----------------
  - tool: redis-cli
    aliases: [valkey-cli, keydb-cli, redis-benchmark, valkey-benchmark, redis-sentinel]
    args:
      - {flag: -a, form: separate, kind: password}
      - {flag: --pass, form: separate, kind: password}
      - {flag: --askpass, form: none, note: 'safe: prompts'}
      - {flag: -u, form: separate, kind: 'connect:uri'}
    env: [REDISCLI_AUTH]
  - tool: mongosh
    aliases: [mongo, mongodump, mongorestore, mongoexport, mongoimport, mongostat, mongotop, mongofiles]
    args:
      - {flag: -p, form: separate, kind: password, note: "'-p' as last arg prompts"}
      - {flag: --password, form: equals_or_separate, kind: password}
      - {flag: --uri, form: equals_or_separate, kind: 'connect:uri'}
      - {position: any, form: positional, kind: 'connect:uri', note: 'mongosh "mongodb://user:pass@host/db"'}
  - tool: etcdctl
    args: [{flag: --password, form: equals_or_separate, kind: password}, {flag: --user, form: equals_or_separate, kind: 'userpass::'}]
    env: [ETCDCTL_PASSWORD, ETCDCTL_USER]
  - tool: rabbitmqctl
    args:
      - {subcommand: add_user, position: 2, form: positional, kind: password}
      - {subcommand: change_password, position: 2, form: positional, kind: password}
      - {subcommand: authenticate_user, position: 2, form: positional, kind: password}
  - tool: rabbitmqadmin
    args: [{flag: -p, form: separate, kind: password}, {flag: --password, form: equals_or_separate, kind: password}]
  - tool: kafka-console-producer
    aliases: [kafka-console-consumer, kafka-topics, kafka-configs, kafka-acls, kafka-consumer-groups, kafka-producer-perf-test]
    args:
      - {flag: --producer-property, form: separate, kind: keyvalue}
      - {flag: --consumer-property, form: separate, kind: keyvalue}
      - {flag: --command-config, form: none, note: path to file -> scan file}
  - tool: kcat
    aliases: [kafkacat]
    args: [{flag: -X, form: separate, kind: keyvalue, note: 'sasl.password=..., ssl.key.password=...'}]
  - tool: mosquitto_pub
    aliases: [mosquitto_sub, mosquitto_rr]
    args: [{flag: -P, form: separate, kind: password}, {flag: --pw, form: separate, kind: password}, {flag: -L, form: separate, kind: 'connect:uri'}]
  - tool: mosquitto_passwd
    args: [{flag: -b, position: 3, form: positional, kind: password, note: 'mosquitto_passwd -b file user pass'}]
  - tool: nats
    args: [{flag: --password, form: equals_or_separate, kind: password}, {flag: --user, form: equals_or_separate, kind: 'userpass::'}, {flag: --token, form: equals_or_separate, kind: token}, {flag: --nkey, form: separate, kind: key}]
  - tool: elasticsearch-reset-password
    note: output contains a new password -> scan tool output in transcripts
  # ---------------- remote access / sysadmin ----------------
  - tool: sshpass
    args: [{flag: -p, form: attached_or_separate, kind: password}]
    env: [SSHPASS]
  - tool: xfreerdp
    aliases: [xfreerdp3, wlfreerdp, sdl-freerdp, sdl-freerdp3]
    args: [{flag: '/p:', form: colon, kind: password}, {flag: '/password:', form: colon, kind: password}, {flag: '/gp:', form: colon, kind: password}, {flag: '/pth:', form: colon, kind: key, note: NTLM hash}]
  - tool: rdesktop
    args: [{flag: -p, form: separate, kind: password}]
  - tool: smbclient
    aliases: [rpcclient, smbcacls, smbget, smbtree, net (samba), mount.smb3]
    args:
      - {flag: -U, form: attached_or_separate, kind: 'userpass:%'}
      - {flag: --user, form: equals_or_separate, kind: 'userpass:%'}
      - {flag: --password, form: equals_or_separate, kind: password}
      - {flag: --pw-nt-hash, form: none, note: next secret value is an NT hash}
  - tool: mount
    aliases: [mount.cifs, mount.smb3, mount.davfs]
    args: [{flag: -o, form: separate, kind: keyvalue, note: 'password=, pass=, credentials= (file)'}]
  - tool: sshfs
    args: [{flag: -o, form: separate, kind: keyvalue}]
  - tool: lftp
    args: [{flag: -u, form: separate, kind: 'userpass:,'}, {flag: --password, form: separate, kind: password}, {pattern: 'open\s+-u\s+[^,\s]+,(?P<secret>\S+)', kind: password}]
    env: [LFTP_PASSWORD]
  - tool: ncftp
    aliases: [ncftpget, ncftpput, ncftpls]
    args: [{flag: -p, form: separate, kind: password}]
  - tool: plink
    aliases: [pscp, psftp, putty, kitty]
    args: [{flag: -pw, form: separate, kind: password}, {flag: -pwfile, form: none, note: file}]
  - tool: winscp.com
    aliases: [WinSCP.exe, winscp]
    args: [{flag: '/password=', form: equals, kind: password}, {flag: '/passphrase=', form: equals, kind: passphrase}, {pattern: 'open\s+\w+://[^:\s]+:(?P<secret>[^@\s]+)@', kind: password}]
  - tool: expect
    note: "scan scripts/inline (-c) for: send \"SECRET\\r\" after expect *assword*"
  - tool: ipmitool
    args: [{flag: -P, form: separate, kind: password}, {flag: -E, form: none, note: env IPMI_PASSWORD}, {flag: -k, form: separate, kind: key}, {flag: -y, form: separate, kind: key}]
    env: [IPMI_PASSWORD, IPMITOOL_PASSWORD]
  - tool: racadm
    args: [{flag: -p, form: separate, kind: password}]
  - tool: snmpwalk
    aliases: [snmpget, snmpset, snmpbulkwalk, snmptrap, snmptable, onesixtyone]
    args:
      - {flag: -c, form: attached_or_separate, kind: password, note: community string; 'public'/'private' -> default_credential}
      - {flag: -A, form: separate, kind: password, note: SNMPv3 auth pass}
      - {flag: -X, form: separate, kind: password, note: SNMPv3 priv pass}
  - tool: vncviewer
    aliases: [x11vnc, vncpasswd]
    args: [{flag: -passwd, form: separate, kind: password, note: x11vnc takes plaintext; vncviewer takes file}]
  - tool: VBoxManage
    args: [{flag: --password, form: equals_or_separate, kind: password}, {flag: --passwordfile, form: none, note: file}]
  - tool: vmrun
    args: [{flag: -gp, form: separate, kind: password}, {flag: -vp, form: separate, kind: password}, {flag: -p, form: separate, kind: password}]
  - tool: govc
    env: [GOVC_PASSWORD, GOVC_URL (connect:uri)]
  - tool: ovftool
    args: [{position: any, form: positional, kind: 'connect:uri', note: 'vi://user:pass@host'}]
  - tool: openstack
    aliases: [nova, cinder, glance, neutron, swift, keystone]
    args: [{flag: --os-password, form: equals_or_separate, kind: password}, {flag: --os-token, form: equals_or_separate, kind: token}, {flag: --os-application-credential-secret, form: equals_or_separate, kind: password}]
    env: [OS_PASSWORD, OS_TOKEN, OS_APPLICATION_CREDENTIAL_SECRET]
  - tool: pvesh
    aliases: [pvesm, qm]
    args: [{flag: --password, form: separate, kind: password}, {flag: --cipassword, form: separate, kind: password}]
  - tool: ldapsearch
    aliases: [ldapadd, ldapmodify, ldapdelete, ldapmodrdn, ldappasswd, ldapwhoami, ldapcompare, ldapexop]
    args: [{flag: -w, form: attached_or_separate, kind: password}, {flag: -s, form: separate, kind: password, note: 'ldappasswd new password'}, {flag: -a, form: separate, kind: password, note: 'ldappasswd old password'}, {flag: -W, form: none, note: prompts}, {flag: -y, form: none, note: file}]
  - tool: kinit
    args: [{flag: --password-file, form: equals, kind: none, note: 'file; "STDIN" -> stdin_sinks'}]
  - tool: net
    note: Windows
    args:
      - {subcommand: use, position: 2, form: positional, kind: password, note: 'net use \\host\share PASS /user:x'}
      - {subcommand: user, position: 2, form: positional, kind: password, note: 'net user NAME PASS /add'}
  - tool: cmdkey
    args: [{flag: '/pass:', form: colon, kind: password}]
  - tool: schtasks
    args: [{flag: /RP, form: separate, kind: password}, {flag: /P, form: separate, kind: password}]
  - tool: sc
    args: [{flag: 'password=', form: separate, kind: password, note: 'sc config svc obj= x password= SECRET'}]
  - tool: runas
    note: no inline password (prompts); flag /savecred
  - tool: psexec
    aliases: [PsExec.exe, PsExec64.exe, paexec]
    args: [{flag: -p, form: separate, kind: password}]
  - tool: wmic
    args: [{flag: '/password:', form: colon, kind: password}]
  - tool: winrs
    args: [{flag: '-p:', form: colon, kind: password}, {flag: '-password:', form: colon, kind: password}]
  - tool: chpasswd
    note: stdin sink 'user:pass'; also '-e' (encrypted hash)
  - tool: usermod
    aliases: [useradd]
    args: [{flag: -p, form: separate, kind: password, note: crypt hash -> password_hash rule}, {flag: --password, form: equals_or_separate, kind: password}]
  - tool: htpasswd
    args: [{flag: -b, position: 'last', form: positional, kind: password, note: 'htpasswd -b[c] file user PASS'}]
  - tool: smbpasswd
    note: stdin sink with -s
  - tool: nmcli
    args:
      - {pattern: '\b(?:password|wifi-sec\.psk|802-1x\.password|vpn\.secrets\.password|wifi-sec\.wep-key0)\s+(?P<secret>\S+)', kind: password}
  - tool: wpa_passphrase
    args: [{position: 2, form: positional, kind: password}]
  - tool: iwctl
    args: [{flag: --passphrase, form: separate, kind: password}]
  - tool: netsh
    args: [{pattern: '\bkey(?:Material)?=(?P<secret>\S+)', kind: password}]
  - tool: openvpn
    args: [{flag: --auth-user-pass, form: none, note: file -> scan}, {flag: --askpass, form: none, note: file}]
  - tool: openconnect
    args: [{flag: --passwd-on-stdin, form: none, note: stdin sink}]
  # ---------------- offensive / security tooling (common in pentest agent logs) ----------------
  - tool: netexec
    aliases: [nxc, crackmapexec, cme, smbmap, kerbrute, enum4linux, enum4linux-ng, ldapdomaindump, bloodhound-python, certipy, bloodyAD, coercer]
    args:
      - {flag: -p, form: separate, kind: password}
      - {flag: --password, form: equals_or_separate, kind: password}
      - {flag: -H, form: separate, kind: key, note: NTLM hash}
      - {flag: --hashes, form: separate, kind: key, note: 'LM:NT'}
  - tool: impacket
    aliases: [secretsdump.py, psexec.py, smbexec.py, wmiexec.py, atexec.py, dcomexec.py, getTGT.py, getST.py, GetUserSPNs.py, GetNPUsers.py, smbclient.py, mssqlclient.py, lookupsid.py, ntlmrelayx.py, impacket-secretsdump, impacket-psexec, impacket-wmiexec, impacket-smbexec, impacket-mssqlclient, impacket-GetUserSPNs]
    args:
      - {position: 1, form: positional, kind: 'connect:impacket_target', note: 'DOMAIN/user:PASS@host'}
      - {flag: -hashes, form: separate, kind: key, note: 'LM:NT'}
      - {flag: -aesKey, form: separate, kind: key}
  - tool: evil-winrm
    args: [{flag: -p, form: separate, kind: password}, {flag: --password, form: separate, kind: password}, {flag: -H, form: separate, kind: key}]
  - tool: hydra
    aliases: [medusa, ncrack, patator]
    args: [{flag: -p, form: separate, kind: password, note: 'single candidate (lower-case -p); -P is a wordlist file'}]
  - tool: responder
    note: output contains NetNTLM hashes -> password_hash rules
  - tool: hashcat
    aliases: [john]
    note: arguments/outputs may contain hashes and cracked 'hash:plaintext' pairs
  # ---------------- HTTP clients ----------------
  - tool: curl
    args:
      - {flag: -u, form: attached_or_separate, kind: 'userpass::'}
      - {flag: --user, form: equals_or_separate, kind: 'userpass::'}
      - {flag: -U, form: separate, kind: 'userpass::'}
      - {flag: --proxy-user, form: equals_or_separate, kind: 'userpass::'}
      - {flag: --oauth2-bearer, form: equals_or_separate, kind: token}
      - {flag: --aws-sigv4, form: none}
      - {flag: -H, form: attached_or_separate, kind: header, note: 'see regex_rules.http'}
      - {flag: --header, form: equals_or_separate, kind: header}
      - {flag: -b, form: separate, kind: cookie}
      - {flag: --cookie, form: equals_or_separate, kind: cookie}
      - {flag: -d, form: separate, kind: body, note: 'scan body: password=, client_secret=, JSON keys'}
      - {flag: --data, form: equals_or_separate, kind: body}
      - {flag: --data-raw, form: equals_or_separate, kind: body}
      - {flag: --data-urlencode, form: equals_or_separate, kind: body}
      - {flag: -F, form: separate, kind: body}
      - {flag: --pass, form: separate, kind: passphrase, note: private key passphrase}
      - {flag: --key, form: none, note: file}
      - {flag: --netrc-file, form: none, note: file}
  - tool: wget
    aliases: [wget2]
    args:
      - {flag: --password, form: equals_or_separate, kind: password}
      - {flag: --http-password, form: equals_or_separate, kind: password}
      - {flag: --http-passwd, form: equals_or_separate, kind: password}
