# -----------------------------------------------------------------------------
# 9. HOME RELOCATIONS -- environment variables that move harness directories
# (agent-harness-files.md 1.4). Used by `--preset agent-home`.
#   replaces: the default location the variable stands for; globs under it are
#             also resolved under the variable's value (both are scanned).
#   default:  value to use when the variable is unset (e.g. $TMPDIR -> /tmp).
#   scan:     the variable names a file or directory whose layout varies;
#             scan everything under it.
# -----------------------------------------------------------------------------
home_relocations:
  - {env: CLAUDE_CONFIG_DIR, replaces: '~/.claude'}
  - {env: CODEX_HOME, replaces: '~/.codex'}
  - {env: QWEN_HOME, replaces: '~/.qwen'}
  - {env: COPILOT_HOME, replaces: '~/.copilot'}
  - {env: CURSOR_CONFIG_DIR, replaces: '~/.cursor'}
  - {env: CLINE_DIR, replaces: '~/.cline'}
  - {env: CLINE_DATA_DIR, replaces: '~/.cline/data'}
  - {env: CONTINUE_GLOBAL_DIR, replaces: '~/.continue'}
  - {env: KIMI_CODE_HOME, replaces: '~/.kimi-code'}
  - {env: INTERPRETER_HOME, replaces: '~/.openinterpreter'}
  - {env: XDG_CONFIG_HOME, replaces: '~/.config'}
  - {env: XDG_DATA_HOME, replaces: '~/.local/share'}
  - {env: XDG_STATE_HOME, replaces: '~/.local/state'}
  - {env: XDG_CACHE_HOME, replaces: '~/.cache'}
  - {env: APPDATA, replaces: '%APPDATA%'}
  - {env: LOCALAPPDATA, replaces: '%LOCALAPPDATA%'}
  - {env: TMPDIR, replaces: '$TMPDIR', default: '/tmp'}
  - {env: CLAUDE_CODE_TMPDIR, scan: true}
  - {env: QWEN_RUNTIME_DIR, scan: true}
  - {env: COPILOT_CACHE_HOME, scan: true}
  - {env: COPILOT_PROVIDERS_CONFIG, scan: true}
  - {env: GEMINI_CLI_SYSTEM_SETTINGS_PATH, scan: true}
  - {env: OPENCODE_DB, scan: true}
  - {env: CRUSH_GLOBAL_CONFIG, scan: true}
  - {env: CRUSH_GLOBAL_DATA, scan: true}
  - {env: GOOSE_PATH_ROOT, scan: true}
  - {env: AMP_SETTINGS_FILE, scan: true}
  - {env: AMP_LOG_FILE, scan: true}
  - {env: OPENHANDS_PERSISTENCE_DIR, scan: true}
  - {env: OPENHANDS_CONVERSATIONS_DIR, scan: true}
  - {env: SWE_AGENT_TRAJECTORY_DIR, scan: true}
