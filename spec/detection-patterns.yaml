  - id: fmt.env-files
    paths: ['**/.env', '**/.env.*', '**/*.env', '**/.envrc', '**/.flaskenv', '**/env.list', '**/.dev.vars', '**/.secrets', '**/secrets.*', '**/.secrets.toml', '**/local.settings.json', '**/appsettings*.json', '**/application*.properties', '**/application*.y*ml', '**/bootstrap*.y*ml', '**/config/database.yml', '**/config/secrets.yml', '**/config/master.key', '**/config/credentials/*.key', '**/wp-config.php', '**/settings.php', '**/configuration.php', '**/LocalSettings.php', '**/config.inc.php', '**/parameters.yml', '**/web.config', '**/app.config', '**/connections.config', '**/context.xml', '**/server.xml', '**/tomcat-users.xml', '**/standalone*.xml', '**/hibernate.cfg.xml', '**/persistence.xml', '**/jaas.conf', '**/*.jaas', '**/client.properties', '**/consumer.properties', '**/producer.properties', '**/odbc.ini', '**/.odbc.ini', '**/tnsnames.ora', '**/sqlnet.ora', '**/freetds.conf', '**/redis.conf', '**/sentinel.conf', '**/pg_service.conf', '**/.pg_service.conf', '**/mongod.conf', '**/elasticsearch.yml', '**/kibana.yml', '**/grafana.ini', '**/rabbitmq.conf', '**/msmtprc', '**/.msmtprc', '**/.muttrc', '**/.fetchmailrc', '**/.offlineimaprc', '**/.mbsyncrc', '**/.esmtprc', '**/ssmtp.conf', '**/postfix/sasl_passwd', '**/wpa_supplicant*.conf', '**/NetworkManager/system-connections/*', '**/*.ovpn', '**/*.conf']
    analyzers: [env_assignment, config_key, connection_string]
  - id: fmt.notebooks
    paths: ['**/*.ipynb']
    parser: jupyter     # scan cell sources AND outputs (agents run cells)
    analyzers: [shell_command, regex_rules, config_key]

# -----------------------------------------------------------------------------
# 7. AGENT STRUCTURES -- where commands and secrets live inside agent files
# -----------------------------------------------------------------------------
# Extractors pull strings out of agent files and route them to analyzers.
# `command` -> shell analyzer (section 3/4) + regex_rules;
# `text`    -> regex_rules (all categories incl. natural_language);
# `env`     -> treat as NAME=VALUE (credential_names, value_filters);
# `headers` -> http rules; `url` -> query/URI rules.
agent_structures:
  # ---- permission / allow-list rules (the Apiiro finding) ----
  - id: agent.claude.permission-rules
    applies_to: ['**/.claude/settings.json', '**/.claude/settings.local.json', '**/.claude/managed-settings.json', '**/managed-settings.json', '**/claude-code/managed-settings.json']
    json_paths:
      - {path: '$.permissions.allow[*]', unwrap: 'Bash\((?P<cmd>.*)\)$', route: command}
      - {path: '$.permissions.ask[*]', unwrap: 'Bash\((?P<cmd>.*)\)$', route: command}
      - {path: '$.permissions.deny[*]', unwrap: 'Bash\((?P<cmd>.*)\)$', route: command}
      - {path: '$.permissions.allow[*]', unwrap: '(?:WebFetch|Fetch)\((?:domain:)?(?P<url>.*)\)$', route: url}
      - {path: '$.permissions.allow[*]', unwrap: 'mcp__[^_]+__\w+\((?P<arg>.*)\)$', route: text}
      - {path: '$.env.*', route: env}
      - {path: '$.apiKeyHelper', route: command}
      - {path: '$.awsAuthRefresh', route: command}
      - {path: '$.awsCredentialExport', route: command}
      - {path: '$.otelHeadersHelper', route: command}
      - {path: '$.hooks..command', route: command}
      - {path: '$.statusLine.command', route: command}
      - {path: '$.mcpServers', route: mcp_servers}
    note: 'unwrap removes the Bash(...) wrapper; trailing ":*" or " *" glob suffixes are stripped before analysis'
  - id: agent.codex.exec-policy-rules
    applies_to: ['**/.codex/rules/*.rules', '**/.openinterpreter/rules/*.rules']
    format: starlark
    extract:
      - {regex: 'prefix_rule\(\s*pattern\s*=\s*\[(?P<argv>[^\]]*)\]', route: command_argv, note: 'argv is a list of quoted tokens; join with spaces and run the shell analyzer'}
    note: 'Codex heuristic path stores the FULL argv of the approved command'
  - id: agent.cursor.shell-rules
    applies_to: ['**/.cursor/cli.json', '**/.cursor/cli-config.json', '**/.config/cursor/cli-config.json', '**/.cursor/permissions.json']
    json_paths:
      - {path: '$.permissions.allow[*]', unwrap: 'Shell\((?P<cmd>.*)\)$', route: command}
      - {path: '$.permissions.deny[*]', unwrap: 'Shell\((?P<cmd>.*)\)$', route: command}
      - {path: '$.terminalAllowlist[*]', route: command}
      - {path: '$.mcpAllowlist[*]', route: text}
  - id: agent.devin.exec-rules
    applies_to: ['**/.devin/config.json', '**/.devin/config.local.json', '**/.config/devin/config.json', '**/devin/config.json']
    json_paths:
      - {path: '$.permissions.allow[*]', unwrap: 'Exec\((?P<cmd>.*)\)$', route: command}
      - {path: '$.permissions.ask[*]', unwrap: 'Exec\((?P<cmd>.*)\)$', route: command}
      - {path: '$.permissions.deny[*]', unwrap: 'Exec\((?P<cmd>.*)\)$', route: command}
  - id: agent.qwen-gemini.policies
    applies_to: ['**/.qwen/settings.json', '**/.gemini/policies/*.toml', '**/.gemini/settings.json']
    json_paths:
      - {path: '$.permissions.allow[*]', unwrap: '(?:Bash|Shell|run_shell_command)\((?P<cmd>.*)\)$', route: command}
      - {path: '$.env.*', route: env}
      - {path: '$.security.auth.apiKey', route: env}
    toml_keys: [commandPrefix, commandRegex, command, argsPattern]
    route: command
  - id: agent.vscode-settings.autoapprove
    applies_to: ['**/Code*/User/settings.json', '**/Cursor/User/settings.json', '**/Windsurf/User/settings.json', '**/Devin/User/settings.json', '**/Trae/User/settings.json', '**/Kiro/User/settings.json', '**/VSCodium/User/settings.json', '**/.vscode/settings.json', '**/.vscode-server/data/User/settings.json']
    json_paths:
      - {path: '$["chat.tools.terminal.autoApprove"]', route: command_keys_or_regex, note: 'object: key = command or /regex/, value = true/false'}
      - {path: '$["chat.tools.urls.autoApprove"]', route: url_keys}
      - {path: '$["roo-cline.allowedCommands"][*]', route: command}
      - {path: '$["roo-cline.deniedCommands"][*]', route: command}
      - {path: '$["kilo-code.allowedCommands"][*]', route: command}
      - {path: '$["windsurf.cascadeCommandsAllowList"][*]', route: command}
      - {path: '$["cline.mcpServers"]', route: mcp_servers}
      - {path: '$.mcp.servers', route: mcp_servers}
  - id: agent.kilo-opencode.permissions
    applies_to: ['**/kilo.json', '**/kilo.jsonc', '**/opencode.json', '**/opencode.jsonc', '**/.config/kilo/*.json*', '**/.config/opencode/*.json*']
    json_paths:
      - {path: '$.permission.bash', route: command_keys, note: 'object keyed by command pattern; Kilo writes the exact command too'}
      - {path: '$.provider.*.options.apiKey', route: env}
      - {path: '$.mcp.*.environment.*', route: env}
      - {path: '$.mcp.*.headers.*', route: headers}
  - id: agent.kiro-junie-copilot.permissions
    applies_to: ['**/.kiro/settings/permissions.yaml', '**/.kiro/workspace-roots/*/permissions.yaml', '**/.junie/allowlist.json', '**/.copilot/permissions-config.json', '**/.augment/settings*.json', '**/.factory/settings*.json']
    key_names: [match, pattern, prefix, glob, commandIdentifiers, shellInputRegex, commandAllowlist, commandDenylist, executables]
    route: command
  - id: agent.shell-snapshot.export
    applies_to: ['**/.codex/shell_snapshots/*.sh', '**/.claude/shell-snapshots/*', '**/.claude/session-env/*']
    regex: '(?m)^(?:export|declare\s+-x)\s+(?P<name>[A-Za-z_][A-Za-z0-9_]*)=(?P<secret>.+)$'
    route: env
    note: 'Codex snapshot = export -p of the login shell: EVERY exported variable; check names against credential_names'
  - id: agent.generic.command-allowlists
    note: 'auto-approve / allow-list arrays in other harnesses (exact keys confirmed in the inventory file)'
    json_key_names: [allow, allowList, allowlist, allowed_commands, allowedCommands, autoApprove, alwaysAllow, autoApproveCommands, allowedTools, trusted_commands, approvedCommands, approved_commands, commandAllowlist, terminal.allowList, chat.tools.terminal.autoApprove, yolo_allowlist, shell_allow, command_allowlist]
    route: command
  # ---- MCP server definitions (any harness) ----
  - id: agent.mcp-servers
    json_roots: ['$.mcpServers', '$.servers', '$.mcp.servers', '$.context_servers', '$.mcp_servers', '$.extensions', '$["mcp-servers"]', '$.mcp']
    per_server:
      - {path: 'env.*', route: env}
      - {path: 'environment.*', route: env}
      - {path: 'headers.*', route: headers, key_is_header_name: true}
      - {path: 'http_headers.*', route: headers, key_is_header_name: true}
      - {path: 'requestInit.headers.*', route: headers, key_is_header_name: true}
      - {path: 'url', route: url}
      - {path: 'serverUrl', route: url}
      - {path: 'command', route: command, join_with: 'args'}
      - {path: 'args[*]', route: command_args}
      - {path: 'auth.*', route: env}
      - {path: 'oauth.clientSecret', route: env}
    toml_roots: ['mcp_servers']          # Codex config.toml [mcp_servers.<name>]
    yaml_roots: ['extensions', 'mcpServers', 'mcp_servers']   # Goose / Continue
    note: 'values like "${env:X}", "${input:x}", "{env:X}" are references -> filtered'
  # ---- transcripts / conversation logs ----
  - id: agent.transcript.jsonl
    note: 'one JSON object per line; walk all string leaves; route by key'
    route_by_key:
      command: [command, cmd, commandLine, command_line, shell_command, script, bash_command, input.command, arguments.command, parameters.command, args.command]
      text: [content, text, output, stdout, stderr, result, message, tool_result, toolResult, observation, response, aggregated_output, formatted_output, summary, display, prompt, input, value]
      url: [url, uri, endpoint]
      env: [env, environment]
    also_scan_unrouted_strings_with: [regex_rules]
    json_string_arguments: true          # tool args often JSON-encoded strings -> parse again
  - id: agent.transcript.markdown
    note: 'chat exports (.specstory, aider history, saved chats): fenced code blocks -> command; rest -> text'
    route_code_fences: {bash: command, sh: command, shell: command, zsh: command, console: command_with_prompt, powershell: command, ps1: command, sql: sql_statement, env: env, dotenv: env, yaml: config_key, json: config_key, toml: config_key, ini: config_key, '': text}
    strip_prompt_prefix: '^(?:\$|#|>|PS [^>]*>|\w+@[\w.-]+:[^$#]*[$#])\s'
  - id: agent.sqlite-stores
    note: 'IDE agents keep chats in SQLite / LevelDB (e.g. VS Code state.vscdb ItemTable values are JSON blobs)'
    tables_and_columns: [{table: ItemTable, column: value}, {table: cursorDiskKV, column: value}, {table: messages, column: content}]
    value_decoding: [utf8_json, utf16_json]
    then: agent.transcript.jsonl
  - id: agent.shell-snapshots
    note: 'captured shell environments (aliases, functions, exported vars)'
    analyzers: [env_assignment, shell_command]
  - id: agent.memory-and-instructions
    note: 'CLAUDE.md, AGENTS.md, GEMINI.md, .cursorrules, rules/*.mdc, .clinerules, memory-bank/*, steering/*.md, .windsurfrules, copilot-instructions.md, CONVENTIONS.md'
    analyzers: [regex_rules, nl.password-is, nl.credentials-block, shell_command_in_code_fences]
  - id: agent.checkpoints
    note: 'shadow git repos / file-history snapshots hold copies of every file the agent touched (incl. .env) -> scan as git (all objects) and as files'
    route: git_repository_or_files

# -----------------------------------------------------------------------------
# 8. PATH RULES -- agent/harness files (populated from agent-harness-files.md)
# -----------------------------------------------------------------------------
# kind:      allowlist | settings | mcp | transcript | history | credential_store |
#            env_capture | checkpoint | memory | log | export
# priority:  p1 = in repositories (often committed)  p2 = developer machine
# parser:    json | jsonc | jsonl | toml | yaml | md | sqlite | starlark | text | git | auto
# use:       agent_structures id(s) and/or analyzers to run
# `~` = home; resolve relocation env vars first (see agent-harness-files.md 1.4).
# {EDITOR} expands to each VS Code-family app dir: Code, 'Code - Insiders', VSCodium,
#   Cursor, Windsurf, Devin, Trae, Kiro, Void. %APPDATA%/%LOCALAPPDATA%/$TMPDIR are env-expanded.
path_rules:
  # ===================== P1: repository files =====================
  - {kind: allowlist, priority: p1, parser: json, use: [agent.claude.permission-rules], harness: claude-code,
     globs: ['**/.claude/settings.local.json', '**/.claude/settings.json']}
  - {kind: allowlist, priority: p1, parser: json, use: [agent.devin.exec-rules], harness: devin,
     globs: ['**/.devin/config.json', '**/.devin/config.local.json']}
  - {kind: allowlist, priority: p1, parser: json, use: [agent.qwen-gemini.policies], harness: qwen-code,
     globs: ['**/.qwen/settings.json']}
  - {kind: allowlist, priority: p1, parser: toml, use: [agent.qwen-gemini.policies], harness: gemini-cli,
     globs: ['**/.gemini/policies/*.toml', '**/.gemini/settings.json']}
  - {kind: allowlist, priority: p1, parser: json, use: [agent.cursor.shell-rules], harness: cursor,
     globs: ['**/.cursor/cli.json', '**/.cursor/permissions.json']}
  - {kind: allowlist, priority: p1, parser: starlark, use: [agent.codex.exec-policy-rules], harness: codex,
     globs: ['**/.codex/rules/*.rules']}
  - {kind: allowlist, priority: p1, parser: json, use: [agent.kiro-junie-copilot.permissions], harness: [factory, augment],
     globs: ['**/.factory/settings.json', '**/.factory/settings.local.json', '**/.augment/settings.json', '**/.augment/settings.local.json']}
  - {kind: settings, priority: p1, parser: jsonc, use: [agent.vscode-settings.autoapprove, agent.mcp-servers], harness: vscode,
     globs: ['**/.vscode/settings.json']}
  - {kind: settings, priority: p1, parser: jsonc, use: [agent.kilo-opencode.permissions, agent.mcp-servers], harness: [kilo, opencode, crush],
     globs: ['**/kilo.json', '**/kilo.jsonc', '**/opencode.json', '**/opencode.jsonc', '**/.opencode/opencode.json', '**/.kilo/*.json*', '**/.kilocode/**/*.json', '**/crush.json', '**/.crush.json', '**/crushrc', '**/.crushrc']}
  - {kind: settings, priority: p1, parser: auto, use: [config_key, agent.mcp-servers], harness: [codex, amp, zed, aider, continue, tabnine, kimi, openinterpreter, warp, goose],
     globs: ['**/.codex/config.toml', '**/.amp/settings.json', '**/.amp/settings.jsonc', '**/.zed/settings.json', '**/.zed/tasks.json', '**/.aider.conf.yml', '**/.aider.model.settings.yml', '**/.aider.model.metadata.json', '**/.continue/**/*.yaml', '**/.continue/**/*.json', '**/.continue/.env', '**/.tabnine/agent/settings.json', '**/.tabnine/mcp_servers.json', '**/.kimi-code/*.toml', '**/.openinterpreter/config.toml', '**/.goose/**', '**/.qwen/.env', '**/.gemini/.env', '**/.github/copilot/settings.json', '**/.github/copilot/settings.local.json']}
  - {kind: mcp, priority: p1, parser: json, use: [agent.mcp-servers], harness: many,
     globs: ['**/.mcp.json', '**/.vscode/mcp.json', '**/.cursor/mcp.json', '**/.roo/mcp.json', '**/.kiro/settings/mcp.json', '**/.junie/mcp/mcp.json', '**/.devin/mcp_config.json', '**/.devin/mcp_config.local.json', '**/.windsurf/mcp_config.json', '**/.factory/mcp.json', '**/.trae/mcp.json', '**/.warp/.mcp.json', '**/.kimi-code/mcp.json', '**/.agents/.mcp.json', '**/.github/mcp.json', '**/.continue/mcpServers/*', '**/.codex-plugin/**/.mcp.json', '**/.claude/plugins/**/.mcp.json', '**/plugins/**/.mcp.json', '**/skills/**/mcp.json']}
  - {kind: memory, priority: p1, parser: md, use: [agent.memory-and-instructions], harness: many,
     globs: ['**/CLAUDE.md', '**/CLAUDE.local.md', '**/.claude/CLAUDE.md', '**/.claude/rules/**', '**/.claude/agent-memory/**', '**/.claude/agents/**', '**/.claude/commands/**', '**/.claude/skills/**', '**/AGENTS.md', '**/AGENTS.local.md', '**/AGENTS.override.md', '**/.codex-agents.md', '**/GEMINI.md', '**/QWEN.md', '**/.qwen/QWEN.local.md', '**/.qwen/team-memory/**', '**/CRUSH.md', '**/CRUSH.local.md', '**/.cursorrules', '**/.cursor/rules/**', '**/.cursor/commands/**', '**/.cursor/skills/**', '**/.cursor/environment.json', '**/.clinerules', '**/.clinerules/**', '**/.cline/**', '**/.roorules*', '**/.roo/rules*/**', '**/.roomodes', '**/.windsurfrules', '**/.windsurf/**', '**/.devin/rules/**', '**/.devin/global_rules.md', '**/.devin/plans/**', '**/.devin/workflows/**', '**/.kiro/steering/**', '**/.kiro/specs/**', '**/.kiro/hooks/**', '**/.kiro/agents/**', '**/.junie/guidelines.md', '**/.junie/**/*.md', '**/.goosehints', '**/.goose/memory/**', '**/.trae/rules/**', '**/.augment/rules/**', '**/.augment/guidelines.md', '**/.augment-guidelines', '**/.voidrules', '**/.rules', '**/CONVENTIONS.md', '**/.github/copilot-instructions.md', '**/.github/instructions/**', '**/.github/agents/*.agent.md', '**/.github/prompts/**', '**/memory-bank/**', '**/.agents/**', '**/.agent/**', '**/.openhands/microagents/**', '**/.openhands/memory/**', '**/.openhands/skills/**', '**/.openhands/setup.sh', '**/PLAN.md', '**/TODO.md', '**/NOTES.md', '**/plans/*.md']}
  - {kind: settings, priority: p1, parser: auto, use: [shell_command, config_key, regex_rules], harness: hooks-and-ci,
     globs: ['**/.github/workflows/copilot-setup-steps.yml', '**/.github/hooks/*.json', '**/.cursor/hooks.json', '**/.cursor/hooks/**', '**/.windsurf/hooks.json', '**/.devin/hooks.v1.json', '**/.openhands/hooks.json', '**/.codex/hooks.json', '**/.claude/hooks/**', '**/.worktreeinclude']}
  - {kind: transcript, priority: p1, parser: auto, use: [agent.transcript.markdown, agent.transcript.jsonl], harness: [specstory, aider, swe-agent, qwen, openhands, generic],
     globs: ['**/.specstory/**', '**/.aider.chat.history.md', '**/.aider.input.history', '**/.aider.llm.history', '**/trajectories/**/*.traj', '**/trajectories/**/*.log', '**/trajectories/**/*.yaml', '**/logs/openai/**', '**/.openhands/**', '**/.plandex-v2/**', '**/.crush/**', '**/.kimi-code/**', '**/.augment-index-state/**']}
  - {kind: log, priority: p1, parser: auto, use: [regex_rules, http], harness: generic,
     globs: ['**/*.heapsnapshot', '**/playwright/.auth/*.json', '**/test-results/**/trace.zip', '**/playwright-report/**', '**/*.har', '**/npm-debug.log*', '**/nohup.out', '**/*.log']}
  - {kind: checkpoint, priority: p1, parser: git, use: [agent.checkpoints], harness: cline,
     refs: ['refs/cline/checkpoints/*'], note: 'Cline SDK writes snapshot objects into the project .git under private refs'}

  # ===================== P2: developer machine =====================
  # ---- Claude Code / Claude Desktop ----
  - {kind: settings, priority: p2, parser: json, use: [agent.claude.permission-rules, agent.mcp-servers], harness: claude-code,
     globs: ['~/.claude.json', '~/.claude/backups/.claude.json*', '~/.claude/settings.json', '~/.claude/remote-settings.json', '/Library/Application Support/ClaudeCode/managed-settings.json', '/etc/claude-code/managed-settings.json', 'C:/ProgramData/ClaudeCode/managed-settings.json']}
  - {kind: credential_store, priority: p2, parser: json, use: [config_key], harness: claude-code,
     globs: ['~/.claude/.credentials.json', '~/.config/anthropic/configs/*', '%APPDATA%/Anthropic/**']}
  - {kind: transcript, priority: p2, parser: jsonl, use: [agent.transcript.jsonl], harness: claude-code,
     globs: ['~/.claude/projects/**/*.jsonl', '~/.claude/projects/**/tool-results/**', '~/.claude/projects/**/mcp-tasks/**', '~/.claude/history.jsonl', '~/.claude/paste-cache/**', '~/.claude/plans/**', '~/.claude/tasks/**', '~/.claude/todos/**', '~/.claude/debug/**', '~/.claude/jobs/**', '~/.claude/sessions/**', '~/.claude/feedback-bundles/**', '~/.claude/usage-data/**', '/tmp/claude-*/**', '/private/tmp/claude-*/**']}
  - {kind: memory, priority: p2, parser: md, use: [agent.memory-and-instructions], harness: claude-code,
     globs: ['~/.claude/CLAUDE.md', '~/.claude/projects/*/memory/**', '~/.claude/agent-memory/**', '~/.claude/plugins/**', '~/.claude/skills/**', '~/.claude/agents/**', '~/.claude/commands/**', '~/.claude/workflows/**']}
  - {kind: env_capture, priority: p2, parser: text, use: [agent.shell-snapshot.export], harness: claude-code,
     globs: ['~/.claude/shell-snapshots/**', '~/.claude/session-env/**', '~/.claude/ide/*.lock']}
  - {kind: checkpoint, priority: p2, parser: auto, use: [agent.checkpoints], harness: claude-code,
     globs: ['~/.claude/file-history/**']}
  - {kind: mcp, priority: p2, parser: json, use: [agent.mcp-servers], harness: claude-desktop,
     globs: ['~/Library/Application Support/Claude/claude_desktop_config.json', '%APPDATA%/Claude/claude_desktop_config.json', '~/.config/Claude/claude_desktop_config.json', '~/.config/claude-desktop/*.json', '~/Library/Logs/Claude/mcp*.log', '%APPDATA%/Claude/logs/**', '~/.config/Claude/logs/**']}
  # ---- Codex / Open Interpreter ----
  - {kind: allowlist, priority: p2, parser: starlark, use: [agent.codex.exec-policy-rules], harness: [codex, openinterpreter],
     globs: ['~/.codex/rules/*.rules', '~/.openinterpreter/rules/*.rules']}
  - {kind: settings, priority: p2, parser: toml, use: [agent.mcp-servers, config_key], harness: [codex, openinterpreter],
     globs: ['~/.codex/config.toml', '/etc/codex/*.toml', '~/.codex/.env', '~/.openinterpreter/config.toml', '~/.config/open-interpreter/profiles/*.yaml']}
  - {kind: credential_store, priority: p2, parser: json, use: [config_key], harness: [codex, openinterpreter],
     globs: ['~/.codex/auth.json', '~/.codex/.credentials.json', '~/.openinterpreter/auth.json']}
  - {kind: transcript, priority: p2, parser: jsonl, use: [agent.transcript.jsonl], harness: [codex, openinterpreter],
     globs: ['~/.codex/sessions/**/*.jsonl', '~/.codex/archived_sessions/**', '~/.codex/history.jsonl', '~/.codex/log/**', '~/.codex/hook_outputs/**', '~/.codex/*_hook_log.jsonl', '~/.codex/memories/**', '~/.codex/*.sqlite*', '~/.codex/db-backups/**', '~/.openinterpreter/sessions/**', '~/.openinterpreter/archived_sessions/**', '~/.openinterpreter/history.jsonl', '~/.openinterpreter/*.sqlite*', '~/.config/open-interpreter/conversations/**']}
  - {kind: env_capture, priority: p2, parser: text, use: [agent.shell-snapshot.export], harness: codex,
     globs: ['~/.codex/shell_snapshots/*.sh'], severity: high}
  - {kind: credential_store, priority: p2, parser: auto, use: [delegated.private_key], harness: codex,
     globs: ['~/.codex/proxy/**'], note: 'network-proxy MITM CA private key'}
  # ---- Gemini / Qwen ----
  - {kind: settings, priority: p2, parser: auto, use: [agent.qwen-gemini.policies, agent.mcp-servers, config_key], harness: [gemini-cli, qwen-code],
     globs: ['~/.gemini/settings.json', '~/.gemini/policies/*.toml', '~/.gemini/.env', '/etc/gemini-cli/*.json', '~/.qwen/settings.json', '~/.qwen/.env', '/etc/qwen-code/*.json']}
  - {kind: credential_store, priority: p2, parser: json, use: [config_key], harness: [gemini-cli, qwen-code],
     globs: ['~/.gemini/oauth_creds.json', '~/.gemini/mcp-oauth-tokens.json', '~/.gemini/a2a-oauth-tokens.json', '~/.gemini/gemini-credentials.json', '~/.qwen/oauth_creds.json', '~/.qwen/mcp-oauth-tokens.json', '$TMPDIR/gemini/ide/*.json'],
     note: 'gemini-credentials.json key = scrypt(hostname, username, constant) -> decryptable'}
