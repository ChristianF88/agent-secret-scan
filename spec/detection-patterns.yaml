  # ---------------- app CLIs / frameworks ----------------
  - tool: wp
    args: [{flag: --admin_password, form: equals, kind: password}, {flag: --user_pass, form: equals, kind: password}, {flag: --dbpass, form: equals, kind: password}, {subcommand: 'config set', pattern: 'config set\s+DB_PASSWORD\s+(?P<secret>\S+)', kind: password}, {subcommand: 'user update', flag: --user_pass, form: equals, kind: password}]
  - tool: drush
    args: [{flag: --account-pass, form: equals, kind: password}, {flag: --db-url, form: equals, kind: 'connect:uri'}, {subcommand: upwd, position: 2, form: positional, kind: password}]
  - tool: php
    note: "php artisan / bin/console: 'tinker' input and --env vars; scan -r code strings with regex_rules"
  - tool: django-admin
    aliases: [python manage.py]
    note: 'createsuperuser is interactive; DJANGO_SUPERUSER_PASSWORD env'
    env: [DJANGO_SUPERUSER_PASSWORD]
  - tool: rails
    note: 'credentials:edit decrypts with RAILS_MASTER_KEY; `rails runner` code strings -> regex_rules'
  - tool: swaks
    args: [{flag: --auth-password, form: equals_or_separate, kind: password}, {flag: -ap, form: separate, kind: password}]
  - tool: msmtp
    aliases: [mutt, neomutt, sendemail, mailx, s-nail]
    args: [{flag: -xp, form: separate, kind: password, note: sendemail}, {flag: -o, form: separate, kind: keyvalue, note: 'mailx -S smtp-auth-password='}, {flag: -S, form: separate, kind: keyvalue}]
  # ---------------- PowerShell cmdlets ----------------
  - tool: ConvertTo-SecureString
    args: [{flag: -String, form: separate, kind: password}, {position: 1, form: positional, kind: password, note: "only when -AsPlainText present"}]
  - tool: New-LocalUser
    aliases: [Set-LocalUser, New-ADUser, Set-ADAccountPassword]
    args: [{flag: -Password, form: separate, kind: password, note: often (ConvertTo-SecureString "x" -AsPlainText -Force)}, {flag: -NewPassword, form: separate, kind: password}, {flag: -AccountPassword, form: separate, kind: password}]
  - tool: Invoke-Sqlcmd
    args: [{flag: -Password, form: separate, kind: password}, {flag: -ConnectionString, form: separate, kind: 'connect:ado_net'}, {flag: -AccessToken, form: separate, kind: token}]
  - tool: New-Object
    args: [{pattern: 'PSCredential\s*\(\s*["''][^"'']+["'']\s*,\s*\(?\s*ConvertTo-SecureString\s+["''](?P<secret>[^"'']+)', kind: password}]
  - tool: Connect-AzAccount
    aliases: [Connect-ExchangeOnline, Connect-MgGraph, Connect-PnPOnline, Connect-VIServer, Connect-MsolService]
    args: [{flag: -Password, form: separate, kind: password}, {flag: -AccessToken, form: separate, kind: token}, {flag: -ClientSecret, form: separate, kind: password}, {flag: -CertificatePassword, form: separate, kind: password}]

# -----------------------------------------------------------------------------
# 5. REGEX RULES -- text rules; run on any text (incl. transcripts, logs)
# -----------------------------------------------------------------------------
# Fields: id, category, overlap (none|partial), confidence, severity,
#         keywords (prefilter literals, lowercase, any-of), regex, pos/neg examples.
# Examples use FAKE values only.
regex_rules:

  # ===== 5.1 Generic command-line flags (fallback when the tool is unknown) =====
  - id: cli.flag.long-password
    category: cli_argument
    overlap: none
    confidence: medium
    severity: high
    keywords: [-pass, _pass, -pwd, _pwd, -secret, _secret, -key, _key, apikey, -token, _token, clientsecret, accesskey, secretkey, authtoken, accesstoken]
    regex: '(?i)(?:^|[\s"''`(])--(?:[a-z0-9]+[-_])*(?:password|passwd|pass|pwd|passphrase|secret|client[-_]?secret|api[-_]?key|apikey|access[-_]?key|secret[-_]?key|auth[-_]?token|access[-_]?token|token)(?:=|[ \t]+)(?P<secret>[^\s"''`\\$|&;<>()]{4,}|"[^"$\\]{4,}"|''[^'']{4,}'')'
    pos:
      - 'mytool --password=Hunter2Xyz --host db.acme.io'
      - 'svc deploy --db-password "K9 w!pass" --region eu'
      - 'cli --client-secret 8f1c2a7e9b'
      - 'Bash(acmectl login --api-key Zq81LmNx44)'
      - 'svc --clientsecret=Abc12345x'
      - 'svc --authtoken Tk9Lm2Qx7'
      - 'svc --accesskey Ak7Wq2Lm9'
    neg:
      - "codex login --with-api-key\n    Read the API key from stdin"
      - '--clerk-secret-key "sk_test_..."'
      - 'mytool --password-file /run/secrets/db'
      - 'mytool --password $DB_PASSWORD'
      - 'mytool --password-stdin'
      - 'mytool --token-type bearer'
      - 'mytool --password'

  - id: cli.flag.env-prefix-assignment
    category: env_assignment
    overlap: partial
    confidence: high
    severity: high
    keywords: [pass, pwd, secret, token, key, auth, credential]
    regex: '(?i)(?:^|[\s"''`(;&|])(?P<name>(?:[A-Z][A-Z0-9_]*)?(?:PASSWORD|PASSWD|_PASS|PWD|PASSPHRASE|SECRET|SECRET_KEY|_TOKEN|API_KEY|APIKEY|ACCESS_KEY|PRIVATE_KEY|AUTH|CREDENTIALS?|SSHPASS|PGPASS|_PAT))=(?P<secret>"[^"$\\]{4,}"|''[^'']{4,}''|[^\s"''`\\$|&;<>()]{4,})'
    note: 'case-sensitive on purpose for UPPER_CASE env names in shell/Dockerfile/.env; name passes credential_names.name_exclusions check'
    pos:
      - 'SERVICE_API_KEY=9fQ2vX7LmP4kT8wZ ./deploy.sh'
      - 'PGPASSWORD=Tr0ub4dor-Kx9q psql -h db.acme.io'
      - 'export DB_PASSWORD="w1nter Is"'
      - 'docker run -e POSTGRES_PASSWORD=Pg9xLmQ2 postgres'
      - '"Env": ["MYSQL_ROOT_PASSWORD=Root9xQw"]'
      - 'SSHPASS=Qw7mZp2Lr sshpass -e ssh h'
    neg:
      - 'ANTHROPIC_API_KEY=your_key_here npm start'
      - 'GITHUB_TOKEN=ghp_your_token_here gh pr list'
      - 'OPENAI_API_KEY=sk-proj-XXXXXXXXXXXXXXXXXXXX ./run'
      - 'GITLAB_TOKEN=glpat-xxxxxxxxxxxx make'
      - 'STRIPE_SECRET_KEY=sk_live_... node app'
      - 'API_KEY=YOUR_API_KEY_HERE ./x'
      - 'DB_PASSWORD=testpassword ./x'
      - 'BRAVE_API_KEY=your-api-key-here npx srv'
      - 'MAPBOX_TOKEN==pk.your-mapbox-access-token yarn'
      - 'PGPASSWORD=$PGPASSWORD psql'
      - 'DB_PASSWORD_FILE=/run/secrets/db'
      - 'MAX_TOKENS=4096'

  # ===== 5.2 Specific inline forms not tied to a single flag token =====
  - id: cli.mysql.attached-p
    category: cli_argument
    overlap: none
    confidence: high
    severity: high
    keywords: [mysql, mariadb]
    regex: '(?i)\b(?:mysql|mysqldump|mysqladmin|mysqlimport|mysqlshow|mysqlcheck|mysqlpump|mysqlsh|mariadb(?:-dump|-admin)?)\b[^\n|;&]*?\s-p(?P<secret>[^\s"''`\\$|&;<>()-][^\s"''`\\|&;<>()]{2,})'
    pos: ['mysql -h 198.51.100.7 -u root -pHx82bLqv93 shop', 'mysqldump -uroot -pS3cr3tQ db > d.sql']
    neg: ['mysql -u root -p', 'mysql -u root -p shop', 'mysql -p$MYSQL_PWD']

  - id: cli.sshpass
    category: cli_argument
    overlap: none
    confidence: high
    severity: critical
    keywords: [sshpass]
    regex: '\bsshpass\s+(?:-[a-oq-zA-Z]\S*\s+)*-p\s*(?P<secret>"[^"$\\]+"|''[^'']+''|[^\s"''`\\$|&;<>()]+)'
    pos: ["sshpass -p 'Qw7!mZp2Lr' ssh deploy@203.0.113.41", 'sshpass -pHunter22 scp f u@h:']
    neg: ['sshpass -e ssh host', 'sshpass -f ~/.pw ssh host']

  - id: cli.redis.auth
    category: cli_argument
    overlap: none
    confidence: high
    severity: high
    keywords: [redis-cli, valkey-cli, keydb-cli]
    regex: '\b(?:redis|valkey|keydb)-cli\b[^\n|;&]*?\s(?:-a|--pass)\s+(?P<secret>"[^"$\\]+"|''[^'']+''|[^\s"''`\\$|&;<>()-][^\s"''`\\|&;<>()]*)'
    pos: ['redis-cli -h cache.acme.io -a R3d1sK3yV7pm ping']
    neg: ['redis-cli --askpass', 'redis-cli -a $REDIS_PASS']

  - id: cli.registry-login.password
    category: cli_argument
    overlap: none
    confidence: high
    severity: high
    keywords: [login]
    regex: '(?i)\b(?:docker|podman|nerdctl|buildah|finch|oras|crane|regctl|helm\s+registry|oc)\s+(?:auth\s+)?login\b[^\n|;&]*?\s(?:-p|--password(?:=|\s))\s*(?P<secret>"[^"$\\]+"|''[^'']+''|[^\s"''`\\$|&;<>()-][^\s"''`\\|&;<>()]*)'
    pos: ['docker login -u acme -p Dk9Lm2Qx7Wv4 registry.acme.io', 'oc login -u dev -p OcPa55word https://api.c:6443']
    neg: ['docker login --password-stdin', 'docker run -p 8080:80 nginx', 'docker login -p $CI_REGISTRY_PASSWORD']

  - id: cli.userpass.colon-flags
    category: cli_argument
    overlap: partial
    confidence: high
    severity: high
    keywords: [-u, --user, -creds, -a, --auth, -auth, --proxy-user]
    regex: '(?i)\b(?:curl|http|https|xh|xhs|httpie|skopeo|etcdctl|nats|ab|lynx|jenkins-cli|websocat|consul)\b[^\n|;&]*?\s(?:-u|--user|-U|--proxy-user|-a|--auth|-auth|-A|--creds|--src-creds|--dest-creds|-http-auth)(?:=|\s+)["'']?(?P<user>[^\s:"''@/\\]{1,64}):(?P<secret>[^\s"''\\@]{3,})["'']?'
    pos: ['curl -u admin:S3cretPw https://api.acme.io/x', 'http -a bob:Pa55w0rd! https://x.acme.io', 'skopeo copy --src-creds u:TokVal99 docker://a docker://b']
    neg: ['curl -u admin: https://x', 'curl -u $USER:$PASS https://x', 'curl -u admin https://x']

  - id: cli.smb.user-percent
    category: cli_argument
    overlap: none
    confidence: high
    severity: high
    keywords: [smbclient, rpcclient, smbcacls, smbget, mount, net]
    regex: '(?i)\b(?:smbclient|rpcclient|smbcacls|smbget|smbtree|net)\b[^\n|;&]*?\s(?:-U|--user(?:=|\s))\s*["'']?(?:[^\s%"'']+[\\/])?[^\s%"'']+%(?P<secret>[^\s"''\\]+)'
    pos: ["smbclient //fs01/share -U 'CORP\\jdoe%Wint3r2026!'", 'rpcclient -U admin%Adm1nPw 10.0.0.5']
    neg: ['smbclient //fs/share -U jdoe', 'smbclient -N //fs/share']

  - id: cli.freerdp.colon
    category: cli_argument
    overlap: none
    confidence: high
    severity: high
    keywords: [freerdp, '/p:', '/password:']
    regex: '(?i)\b\w*freerdp\w*\b[^\n|;&]*?\s/(?:p|password|gp):(?P<secret>"[^"]+"|''[^'']+''|[^\s"''\\]+)'
    pos: ['xfreerdp /v:10.1.2.3 /u:admin /p:Rdp!Pass2026 /cert:ignore']
    neg: ['xfreerdp /v:10.1.2.3 /u:admin']

  - id: cli.windows.colon-password
    category: cli_argument
    overlap: none
    confidence: medium
    severity: high
    keywords: ['/pass:', '/password:', '/p:', '-p:', '-pass:', '-password:']
    regex: '(?i)\b(?:cmdkey|wmic|winrs|xfreerdp|mstsc|psexec|runas)\b[^\n]*?\s[/-](?:pass|password|p):(?P<secret>"[^"]+"|[^\s"\\]+)'
    pos: ['cmdkey /generic:TERMSRV/h /user:adm /pass:Cmdk3yPw', 'wmic /node:h /user:adm /password:WmIcPw1 os get', 'psexec \\h -u adm -pass:Wx9pass77 cmd']
    neg: ['cmdkey /list']

  - id: cli.net-use.password
    category: cli_argument
    overlap: none
    confidence: medium
    severity: high
    keywords: [net use, net user]
    regex: '(?i)\bnet\s+use\s+(?:[A-Z]:\s+)?\\\\\S+\s+(?P<secret>[^\s/*"][^\s"]*)\s+/user:'
    pos: ['net use Z: \\fs01\share Sh4reP@ss /user:CORP\jdoe']
    neg: ['net use Z: \\fs01\share /user:CORP\jdoe', 'net use Z: \\fs01\share * /user:x']

  - id: cli.net-user.add
    category: cli_argument
    overlap: none
    confidence: medium
    severity: high
    keywords: [net user]
    regex: '(?i)\bnet\s+user\s+\S+\s+(?P<secret>[^\s/*"][^\s"]*)\s+/add\b'
    pos: ['net user backdoor B4ckd00rPw /add']
    neg: ['net user bob /add', 'net user bob * /add']

  - id: cli.oracle.userpass-at
    category: cli_argument
    overlap: none
    confidence: high
    severity: high
    keywords: [sqlplus, rman, expdp, impdp, sqlldr, dgmgrl, connect]
    regex: '(?i)\b(?:sqlplus|sql|rman|expdp|impdp|exp|imp|sqlldr|dgmgrl|connect|conn)\s+(?:-[sSlLmMrR]\w*\s+)*["'']?(?P<user>[A-Za-z][A-Za-z0-9_$#]{0,29})/(?P<secret>[^@\s/"''\\]{3,})@(?P<host>[^\s"''\\;]+)'
    pos: ['sqlplus scott/T1gerPw9@orcl.acme.io:1521/PDB1', 'expdp system/Manag3rX@prod schemas=HR', 'CONNECT app/AppPw2026@//db.acme.io/svc']
    neg: ['sqlplus / as sysdba', 'sqlplus scott@orcl']

  - id: cli.impacket.target
    category: cli_argument
    overlap: none
    confidence: high
    severity: critical
    keywords: [.py, impacket-]
    regex: '(?i)\b(?:impacket-\w+|\w+(?:exec|dump|client|SPNs|NPUsers|TGT|ST|sid|relayx)\.py)\s+(?:-\S+\s+)*["'']?(?:[\w.-]+/)?(?P<user>[\w.$-]+):(?P<secret>[^@\s"''\\]+)@(?P<host>[\w.-]+)'
    pos: ['secretsdump.py CORP/admin:Adm1nPw!@10.0.0.10', 'impacket-psexec acme.local/svc_sql:SqlSvc2026@dc01.acme.local']
    neg: ['secretsdump.py -hashes :abc CORP/admin@10.0.0.10']

  - id: cli.offensive.p-flag
    category: cli_argument
    overlap: none
    confidence: medium
    severity: high
    keywords: [nxc, netexec, crackmapexec, cme, evil-winrm, smbmap, kerbrute, certipy, bloodyad, hydra, medusa]
    regex: '(?i)\b(?:nxc|netexec|crackmapexec|cme|evil-winrm|smbmap|kerbrute|certipy(?:-ad)?|bloodyAD|bloodhound-python|ldapdomaindump|enum4linux(?:-ng)?|hydra|medusa)\b[^\n|;&]*?\s(?:-p|--password)(?:=|\s+)(?P<secret>"[^"]+"|''[^'']+''|[^\s"''\\-][^\s"''\\]*)'
    pos: ["nxc smb 10.0.0.0/24 -u admin -p 'Spring2026!'", 'evil-winrm -i 10.0.0.5 -u adm -p EvWinRm9']
    neg: ['nxc smb 10.0.0.5 -u admin -H :aad3b435', 'hydra -P rockyou.txt ssh://h']

  - id: cli.ldap.bind-w
    category: cli_argument
    overlap: none
    confidence: high
    severity: high
    keywords: [ldapsearch, ldapadd, ldapmodify, ldapdelete, ldappasswd, ldapwhoami]
    regex: '\bldap(?:search|add|modify|delete|modrdn|passwd|whoami|compare|exop)\b[^\n|;&]*?\s-w\s+(?P<secret>"[^"]+"|''[^'']+''|[^\s"''\\$-][^\s"''\\]*)'
    pos: ["ldapsearch -x -H ldap://dc.acme.io -D 'cn=admin,dc=acme' -w LdapB1nd! -b dc=acme"]
    neg: ['ldapsearch -x -W -D cn=admin', 'ldapsearch -y /etc/ldap.pw']

  - id: cli.openssl.pass-prefix
    category: cli_argument
    overlap: none
    confidence: high
    severity: medium
    keywords: ['pass:', openssl, apksigner]
    regex: '(?i)(?:-passin|-passout|-pass|-password|--ks-pass|--key-pass)\s+["'']?pass:(?P<secret>[^\s"''\\]+)'
    pos: ['openssl pkcs12 -export -in c.pem -out c.p12 -passout pass:P12Expo!', 'apksigner sign --ks k.jks --ks-pass pass:Andr0idKs']
    neg: ['openssl rsa -passin env:KEY_PASS', 'openssl rsa -passin file:/run/p']

  - id: cli.keytool.storepass
    category: cli_argument
    overlap: none
    confidence: high
    severity: medium
    keywords: [keytool, jarsigner, storepass, keypass]
    regex: '(?i)\b(?:keytool|jarsigner)\b[^\n|;&]*?\s-(?:storepass|keypass|srcstorepass|deststorepass|srckeypass|destkeypass)\s+(?P<secret>"[^"]+"|''[^'']+''|[^\s"''\\$-][^\s"''\\]*)'
    pos: ['keytool -importcert -keystore ks.jks -storepass KsPa55word -file c.crt']
    neg: ['keytool -list -keystore ks.jks']

  - id: cli.archive.password
    category: cli_argument
    overlap: none
    confidence: medium
    severity: medium
    keywords: [zip, unzip, 7z, 7za, 7zz, rar, unrar]
    regex: '\b(?:(?:un)?zip\s[^\n|;&]*?\s(?:-P|--password(?:=|\s))\s*|(?:7z|7za|7zz|7zr|rar|unrar)\s[^\n|;&]*?\s-h?p)(?P<secret>"[^"]+"|''[^'']+''|[^\s"''\\$-][^\s"''\\]*)'
    pos: ['zip -r -P ZipPw2026 out.zip dir/', '7z a -pArch1vePw -mhe=on out.7z dir']
    neg: ['7z a out.7z dir', 'zip -r out.zip dir']

  - id: cli.gpg.passphrase
    category: cli_argument
    overlap: none
    confidence: high
    severity: medium
    keywords: [--passphrase]
    regex: '\bgpg2?\b[^\n|;&]*?\s--passphrase(?:=|\s+)(?P<secret>"[^"]+"|''[^'']+''|[^\s"''\\$-][^\s"''\\]*)'
    pos: ["gpg --batch --pinentry-mode loopback --passphrase 'Gpg phrase 9' -d f.gpg"]
    neg: ['gpg --passphrase-file p.txt -d f.gpg', 'gpg --passphrase-fd 0']

  - id: cli.ssh-keygen.passphrase
    category: cli_argument
    overlap: none
    confidence: medium
    severity: low
    keywords: [ssh-keygen]
    regex: '\bssh-keygen\b[^\n|;&]*?\s-[NP]\s+(?P<secret>"[^"]+"|''[^'']+''|[^\s"''\\$-][^\s"''\\]*)'
    pos: ["ssh-keygen -t ed25519 -N 'K3y Phrase' -f k"]
    neg: ["ssh-keygen -t ed25519 -N '' -f k"]

  - id: cli.ipmi.password
    category: cli_argument
    overlap: none
    confidence: high
    severity: high
    keywords: [ipmitool, racadm]
    regex: '\b(?:ipmitool|racadm)\b[^\n|;&]*?\s-P\s+(?P<secret>"[^"]+"|''[^'']+''|[^\s"''\\$-][^\s"''\\]*)'
    pos: ['ipmitool -I lanplus -H 10.9.9.9 -U ADMIN -P Ipm1Pass chassis status']
    neg: ['ipmitool -I lanplus -H h -U ADMIN -E chassis status']

  - id: cli.snmp.community-or-v3
    category: cli_argument
    overlap: none
    confidence: medium
    severity: medium
    keywords: [snmpwalk, snmpget, snmpset, snmpbulkwalk, snmptrap, onesixtyone]
    regex: '\bsnmp(?:walk|get|set|bulkwalk|bulkget|trap|table|getnext)\b[^\n|;&]*?\s-(?:c|A|X)\s*(?P<secret>"[^"]+"|''[^'']+''|[^\s"''\\$-][^\s"''\\]*)'
    pos: ['snmpwalk -v2c -c n0tPubl1c 10.1.1.1', 'snmpget -v3 -u mon -l authPriv -a SHA -A AuthPhr4se -x AES -X PrivPhr4se h sysName.0']
    neg: ['snmpwalk -v3 -u mon -l noAuthNoPriv h']

  - id: cli.kubectl.from-literal
    category: cli_argument
    overlap: none
    confidence: high
    severity: high
    keywords: [from-literal, docker-password]
    regex: '(?i)--(?:from-literal=[^=\s"'']+|docker-password)=["'']?(?P<secret>[^\s"''\\$][^\s"''\\]*)'
    pos: ['kubectl create secret generic db --from-literal=password=KubePw2026', 'kubectl create secret docker-registry r --docker-password=Rg9Pw']
    neg: ['kubectl create secret generic db --from-file=pw.txt', 'kubectl create secret generic db --from-literal=password=$PW']

  - id: cli.keyvalue-arg.secret-name
    category: cli_argument
    overlap: none
    confidence: medium
    severity: high
    keywords: [-var, -e, --set, --extra-vars, -D, -P, --build-arg, --env, --dart-define, --env-var, -X, -o, --config]
    regex: '(?i)(?:\s-var|\s-e|\s--set(?:-string)?|\s--extra-vars|\s--build-arg|\s--env|\s--dart-define|\s--env-var|\s--global-var|\s-X|\s-o|\s--config|\s-c|\s-D|\s-P|\s-backend-config)(?:=|\s+)?["'']?(?P<name>[A-Za-z0-9_.\[\]/:-]*(?:password|passwd|_pass|pwd|passphrase|secret|token|api_?key|apikey|access_?key|private_?key|credential|jaas\.config)[A-Za-z0-9_.\[\]-]*)=["'']?(?P<secret>[^\s"''\\$,][^\s"''\\,]*)'
    pos: ["terraform apply -var 'db_password=TfPw2026x'", 'ansible-playbook site.yml -e ansible_become_pass=B3c0me!', 'mvn deploy -Dgpg.passphrase=GpgMvn99', 'helm install x c --set auth.rootPassword=HelmR00t', 'kcat -X sasl.password=Kc4tPw -b k:9092', 'docker build --build-arg NPM_TOKEN=abc123def456 .']
    neg: ['terraform apply -var db_password=$TF_VAR_x', 'ansible-playbook -e env=prod', 'helm install x c --set replicaCount=3']

  - id: cli.positional.after-subcommand
    category: cli_argument
    overlap: none
    confidence: medium
    severity: high
