# cargo-fuzz targets. Not a workspace member, so stable builds never see it.
#   cargo +nightly fuzz run shell_analyze -- -max_total_time=600
#   mkdir -p fuzz/corpus/sqlite_read && cp crates/extractors/tests/data/*.vscdb fuzz/corpus/sqlite_read/
#   cargo +nightly fuzz run sqlite_read -- -max_total_time=300
#   cargo +nightly fuzz run git_pack -- -max_total_time=300 -rss_limit_mb=1500
#   cargo +nightly fuzz run git_index -- -max_total_time=300 -rss_limit_mb=1500
[package]
name = "agentleaks-fuzz"
version = "0.0.0"
edition = "2024"
publish = false

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"
agentleaks-core = { path = "../crates/core" }
agentleaks-extractors = { path = "../crates/extractors" }
agentleaks-shell = { path = "../crates/shell" }
agentleaks-spec = { path = "../crates/spec" }
agentleaks-source-git = { path = "../crates/source-git" }

[[bin]]
name = "shell_analyze"
path = "fuzz_targets/shell_analyze.rs"
test = false
doc = false
bench = false

# Own workspace: keeps this crate out of the main one.
[workspace]
members = ["."]

[[bin]]
name = "sqlite_read"
path = "fuzz_targets/sqlite_read.rs"
test = false
doc = false
bench = false

[[bin]]
name = "git_pack"
path = "fuzz_targets/git_pack.rs"
test = false
doc = false
bench = false

[[bin]]
name = "git_index"
path = "fuzz_targets/git_index.rs"
test = false
doc = false
bench = false
