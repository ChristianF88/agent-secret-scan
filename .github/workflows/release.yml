# Release: pushing a tag vX.Y.Z (matching the workspace version in Cargo.toml)
# runs the quality gate on Linux and the tests on macOS, builds the binaries
# only if both pass, and publishes them as a GitHub release.
#
# Third-party code is limited to GitHub's own actions, pinned to commit SHAs.
# The Rust toolchain comes from rust-toolchain.toml through the runner's rustup.

name: release

on:
  push:
    tags: ["v[0-9]+.[0-9]+.[0-9]+*"]

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"

jobs:
  checks:
    name: Quality gate (fmt, clippy, catalogue, tests) on Linux
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: The tag names the workspace version
        run: |
          version=$(python3 -c 'import tomllib; print(tomllib.load(open("Cargo.toml", "rb"))["workspace"]["package"]["version"])')
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::tag $GITHUB_REF_NAME does not match version $version in Cargo.toml"
            exit 1
          fi
      - name: Toolchain
        run: |
          channel=$(sed -n 's/^channel *= *"\(.*\)"/\1/p' rust-toolchain.toml)
          rustup toolchain install "$channel" --profile minimal --component clippy,rustfmt
      - name: PyYAML for the catalogue self-test
        run: sudo apt-get update -q && sudo apt-get install -y -q python3-yaml
      - name: scripts/check.sh (the pre-commit gate)
        run: scripts/check.sh

  test-macos:
    name: Tests on macOS
    runs-on: macos-15
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Toolchain
        run: |
          channel=$(sed -n 's/^channel *= *"\(.*\)"/\1/p' rust-toolchain.toml)
          rustup toolchain install "$channel" --profile minimal
      - name: cargo test
        run: cargo test --workspace --locked

  build:
    name: Build ${{ matrix.target }}
    needs: [checks, test-macos]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: true
      matrix:
        include:
          # Ubuntu 22.04: glibc 2.35, so the binaries run on older distributions too.
          - { target: x86_64-unknown-linux-gnu, os: ubuntu-22.04, native: true }
          - { target: aarch64-unknown-linux-gnu, os: ubuntu-22.04-arm, native: true }
          - { target: aarch64-apple-darwin, os: macos-15, native: true }
          - { target: x86_64-apple-darwin, os: macos-15, native: false }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Toolchain
        run: |
          channel=$(sed -n 's/^channel *= *"\(.*\)"/\1/p' rust-toolchain.toml)
          rustup toolchain install "$channel" --profile minimal --target "${{ matrix.target }}"
      - name: Build (dist profile)
        run: cargo build --profile dist --locked -p agent-secret-scan --target "${{ matrix.target }}"
      - name: Smoke test
        if: matrix.native
        run: |
          bin="target/${{ matrix.target }}/dist/agent-secret-scan"
          "$bin" --version
          # The fixtures hold invented credentials: exit code 1 means findings.
          set +e
          AGENT_SECRET_SCAN_HMAC_KEY=smoke "$bin" local fixtures/ --no-config --format jsonl -o smoke.jsonl
          code=$?
          set -e
          test "$code" -eq 1 && test -s smoke.jsonl
      - name: Package
        run: |
          name="agent-secret-scan-${GITHUB_REF_NAME}-${{ matrix.target }}"
          mkdir -p "dist/$name"
          cp "target/${{ matrix.target }}/dist/agent-secret-scan" README.md "dist/$name/"
          tar -C dist -czf "dist/$name.tar.gz" "$name"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ matrix.target }}
          path: dist/*.tar.gz
          if-no-files-found: error
          retention-days: 7

  release:
    name: Publish the GitHub release
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: dist
          merge-multiple: true
      - name: Checksums
        run: cd dist && sha256sum -- *.tar.gz > SHA256SUMS && cat SHA256SUMS
      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/*.tar.gz dist/SHA256SUMS \
            --repo "$GITHUB_REPOSITORY" \
            --verify-tag \
            --title "agent-secret-scan $GITHUB_REF_NAME" \
            --generate-notes
